      "85": {fn: "Bobine − (masse caisse)", cls: GND_PWR}
      "30": {fn: "Contact → entrée DIN1 (CMC1 K3)"}
      "87": {fn: "Contact → Sensor GND", cls: GND_SENS}
  K7:
    label: "Relais bouton 6 (ALS off)"
    ref: "Relais ISO mini 4 broches (contact travail)"
    type: relay
    signal: true
    rating_a: 30
    system: COM
    node: PDM
    connector: "Support de relais ISO mini étanche (lames 6,3 mm)"
    load_a: 0.15
    rank: 100
