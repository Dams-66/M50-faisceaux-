# layout: ecu  = ECU à gauche, capteurs/actionneurs au centre, alim/masses à droite
#         flow = mise en page en cascade depuis la racine indiquée
# -----------------------------------------------------------------------------
sheets:
  PWR:  {short: "Alimentation", title: "Alimentation & relais principal", layout: flow, root: BATT}
  GND:  {short: "Masses ECU", title: "Masses ECU", layout: ecu}
  IGN:  {short: "Allumage", title: "Allumage — 6 bobines intelligentes", layout: ecu}
  INJ:  {short: "Injection", title: "Injection — 6 × 870 cc", layout: ecu}
  SYNC: {short: "PMH / AAC", title: "Synchronisation PMH / AAC & blindages", layout: ecu}
  SNS:  {short: "Capteurs", title: "Capteurs température / pression & distribution 5 V / Sensor GND", layout: ecu}
  DBW:  {short: "Papillon & pédale", title: "Papillon motorisé & pédale", layout: ecu}
  WBO:  {short: "Lambda & EGT", title: "Lambda LSU 4.9 & EGT", layout: ecu}
  KNK:  {short: "Cliquetis", title: "Cliquetis", layout: ecu}
  ACT:  {short: "VANOS & boost", title: "VANOS & MAC valve (boost)", layout: ecu}
  RLY:  {short: "Pompe & ventilo", title: "Pompe à essence & ventilateur", layout: flow, root: CMC1}
  DEM:  {short: "Démarrage & charge", title: "Contact, démarreur & excitation alternateur", layout: flow, root: BUS30}
  COM:  {short: "Habitacle", title: "Habitacle (compte-tours, CAN)", layout: ecu}

systems:
  PWR:  {label: "Alimentation"}
  GND:  {label: "Masses"}
  IGN:  {label: "Allumage"}
  INJ:  {label: "Injection"}
  SYNC: {label: "Synchro"}
  SNS:  {label: "Capteurs"}
  DBW:  {label: "Papillon / pédale"}
  WBO:  {label: "Lambda / EGT"}
