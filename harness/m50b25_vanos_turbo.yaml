  SNS:  {short: "Capteurs", title: "Capteurs température / pression & distribution 5 V / Sensor GND", layout: ecu}
  DBW:  {short: "Papillon & pédale", title: "Papillon motorisé & pédale", layout: ecu}
  WBO:  {short: "Lambda & EGT", title: "Lambda LSU 4.9 & EGT", layout: ecu}
  KNK:  {short: "Cliquetis", title: "Cliquetis", layout: ecu}
  ACT:  {short: "VANOS & boost", title: "VANOS & MAC valve (boost)", layout: ecu}
  RLY:  {short: "Pompe & ventilo", title: "Pompe à essence & ventilateur", layout: flow, root: CMC1}
  DEM:  {short: "Démarrage & charge", title: "Contact, démarreur & excitation alternateur", layout: flow, root: BUS30}
  COM:  {short: "Pad & CAN", title: "Habitacle : pad de commandes → ECU, CAN", layout: ecu}

systems:
