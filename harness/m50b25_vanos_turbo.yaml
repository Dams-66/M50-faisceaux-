      "86": {fn: "Bobine +", cls: V15, supply: true}
      "85": {fn: "Bobine −", cls: GND_PWR}
  K2:
    label: "Relais pompe à essence"
    ref: "Relais ISO mini 30/40 A"
    type: relay
    rating_a: 30
    system: RLY
    node: PDM
    connector: "Support de relais ISO mini étanche (lames 6,3 mm)"
    load_a: 0.15
    pins:
      "30": {fn: "Contact — entrée"}
      "87": {fn: "Contact — sortie"}
      "86": {fn: "Bobine +", cls: PWR12, supply: true}
      "85": {fn: "Bobine − (GPO2)"}
  K3:
    label: "Relais ventilateur"
    ref: "Relais ISO mini 40 A"
    type: relay
    rating_a: 40
    system: RLY
    node: PDM
    connector: "Support de relais ISO mini étanche (lames 6,3 mm)"
    load_a: 0.15
    pins:
      "30": {fn: "Contact — entrée"}
      "87": {fn: "Contact — sortie"}
      "86": {fn: "Bobine +", cls: PWR12, supply: true}
      "85": {fn: "Bobine − (GPO6)"}
  K4:
    label: "Relais démarreur"
    ref: "Relais ISO mini 40 A"
    type: relay
    rating_a: 40
    system: DEM
    node: PDM
    connector: "Support de relais ISO mini étanche (lames 6,3 mm)"
    load_a: 0.15
    pins:
      "30": {fn: "Contact — entrée"}
      "87": {fn: "Contact — sortie vers borne 50"}
      "86": {fn: "Bobine + (bouton démarreur)", cls: V50, supply: true}
      "85": {fn: "Bobine −", cls: GND_PWR}
    notes: "Le bouton ne commande que la bobine (0,15 A) : le courant d'appel du solénoïde passe par le relais, au plus près de la batterie."
  K5:
    label: "Relais bouton 4 (ventilation forcée)"
    ref: "Relais ISO mini 4 broches (contact travail)"
    type: relay
    signal: true
    rating_a: 30
    system: COM
    node: PDM
    connector: "Support de relais ISO mini étanche (lames 6,3 mm)"
    load_a: 0.15
    rank: 100
    pins:
      "86": {fn: "Bobine + (sortie bouton 4 du pad)", cls: PWR12, supply: true}
      "85": {fn: "Bobine − (masse caisse)", cls: GND_PWR}
      "30": {fn: "Contact → entrée DIN3 (CMC1 C1)"}
      "87": {fn: "Contact → Sensor GND", cls: GND_SENS}
    notes: "Bouton allumé, le relais colle et met l'entrée ECU à la masse capteurs : c'est le câblage « interrupteur → masse » du plan MaxxECU, avec le pull-up de l'entrée activé. Le contact ne coupe que 5 mA sous 5 V : un relais ISO standard convient, mais si un bouton devient capricieux avec les années, changer le relais (ou en prendre un à contacts dorés)."
  K6:
