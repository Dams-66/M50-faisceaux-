# -----------------------------------------------------------------------------
# Composants. cls = classe électrique attendue sur la broche (ERC) :
#   PWR12 (+12 V), V5 (+5 V), V15 (+15 clé), GND_PWR, GND_SENS, GND_VR,
#   GND_KNOCK, GND_SHIELD. Sans cls = signal.
# supply: true = broche d'alimentation de la charge (bilan fusibles)
# -----------------------------------------------------------------------------
components:
  # ---------------- Capteurs température / pression ----------------
  IAT:
    label: "Température air admission"
    ref: "Bosch 0 280 130 039"
    type: "NTC 2 fils (≈ 2,5 kΩ à 20 °C)"
    connector: "Bosch JPT 2 voies"
    system: SNS
    node: N_IAT
    pins:
      "1": {fn: "Signal NTC"}
      "2": {fn: "Retour", cls: GND_SENS}
    notes: "Pas de polarité. Calibration MTune : Bosch NTC."
  CLT:
    label: "Température eau"
    ref: "Bosch 0 280 130 026"
    type: "NTC 2 fils"
    connector: "Bosch JPT 2 voies"
    system: SNS
    node: N_CLT
    pins:
      "1": {fn: "Signal NTC"}
      "2": {fn: "Retour", cls: GND_SENS}
    notes: "Pas de polarité."
  OIL:
    label: "Pression + température huile"
    ref: "Bosch 0 261 544 01F"
    type: "0–10 bar (0,5–4,5 V) + NTC, alim 5 V"
    connector: "Connecteur Bosch du capteur (broche 1 non câblée)"
    system: SNS
    node: N_OIL
    supply5_ma: 10
    pins:
      "1": {fn: "Non assignée", nc: true}
      "2": {fn: "Pression 0,5–4,5 V"}
      "3": {fn: "+5 V", cls: V5}
      "4": {fn: "Masse capteur", cls: GND_SENS}
      "5": {fn: "Température NTC"}
    notes: "0,5 V = 0 bar ; 4,5 V = 10 bar. NTC : 44 864 Ω à −40 °C, 72 Ω à 140 °C."
  FUEL:
    label: "Pression + température essence"
    ref: "Bosch 0 261 544 01F"
    type: "0–10 bar (0,5–4,5 V) + NTC, alim 5 V"
    connector: "Connecteur Bosch du capteur (broche 1 non câblée)"
    system: SNS
    node: N_FUEL
    supply5_ma: 10
    pins:
      "1": {fn: "Non assignée", nc: true}
      "2": {fn: "Pression 0,5–4,5 V"}
      "3": {fn: "+5 V", cls: V5}
      "4": {fn: "Masse capteur", cls: GND_SENS}
      "5": {fn: "Température NTC"}
    notes: "Permet la pression différentielle essence/MAP dans MTune."

  # ---------------- Synchronisation ----------------
  CRANK:
    label: "Capteur PMH (vilebrequin)"
    ref: "BMW 12141703277 (type M52)"
    type: "Effet Hall 3 fils, alim 12 V"
    connector: "BMW 3 voies (capteur M52)"
    system: SYNC
    node: N_CRANK
    load_a: 0.02
    pins:
      "1": {fn: "+12 V", cls: PWR12, supply: true}
      "2": {fn: "Signal Hall"}
      "3": {fn: "Masse capteur", cls: GND_VR}
    notes: "Lit la cible 60-2 avant du M50 : support et entrefer à valider. MTune : trigger en mode Digital (hall) avec la résistance de rappel (pull-up) interne ACTIVÉE : la sortie Hall ne fait que tirer le signal à la masse."
    verify: "Brochage à confirmer sur le capteur avant sertissage (alim 1 / signal 2 / masse 3)."
  CAM:
    label: "Capteur AAC (arbre à cames)"
    ref: "Delphi SS11198 / BMW 12141726590 / Bosch 0 261 210 053"
    type: "Inductif (VR) — PAS de +12 V"
    connector: "Bosch JPT 3 voies"
    system: SYNC
    node: N_CAM
    pins:
      "1": {fn: "Signal (+)"}
      "2": {fn: "Retour (−)", cls: GND_VR}
      "3": {fn: "Blindage", cls: GND_SHIELD}
    notes: "Option recommandée par MaxxECU pour une culasse M50 VANOS. Si la synchro est instable : inverser 1 et 2 (polarité VR)."
    verify: "Mesurer la continuité broche 3 ↔ corps du capteur : s'il y a continuité, NE PAS relier le blindage côté capteur."

  # ---------------- Cliquetis ----------------
  KS1:
    label: "Capteur cliquetis 1 (cyl. 1-2-3)"
    ref: "Bosch 0 261 231 195 / BMW 12141738667"
    type: "Piézo 2 fils"
    connector: "Bosch 2 voies"
    system: KNK
    node: N_KS1
    pins:
      "1": {fn: "Signal"}
      "2": {fn: "Retour", cls: GND_KNOCK}
    notes: "Pas de polarité (MaxxECU). Serrage 20 N·m, sans rondelle."
  KS2:
    label: "Capteur cliquetis 2 (cyl. 4-5-6)"
    ref: "Bosch 0 261 231 195 / BMW 12141738667"
    type: "Piézo 2 fils"
    connector: "Bosch 2 voies"
    system: KNK
    node: N_KS2
    pins:
      "1": {fn: "Signal"}
      "2": {fn: "Retour", cls: GND_KNOCK}
    notes: "Pas de polarité. Serrage 20 N·m, sans rondelle."

  # ---------------- Lambda / EGT ----------------
  LSU:
    label: "Sonde lambda large bande"
    ref: "Bosch LSU 4.9 — 0 258 017 025"
    type: "WBO2 6 fils (contrôleur interne RACE REV9+)"
    connector: "Contre-connecteur LSU 4.9 6 voies côté faisceau (Bosch D 261 205 356-01 ou kit Bosch Motorsport 1 987 280 016)"
    system: WBO
    node: N_LSU
    load_a: 1.5
    pins:
      "1": {fn: "IP (pompe)"}
      "2": {fn: "VM / COM"}
      "3": {fn: "Chauffage −"}
      "4": {fn: "Chauffage +12 V", cls: PWR12, supply: true}
      "5": {fn: "RCAL (IA)"}
      "6": {fn: "VS (UN / Nernst)"}
    notes: "Brochage identique au schéma MaxxECU (LSU 4.9 vue côté câble). Capteur à sélectionner dans MTune avant usage. Connecteur fixé côté froid (< 140 °C, fiche Bosch) : seule la queue d'origine de la sonde longe la descente, le faisceau ne va pas jusqu'au turbo."
  EGT1:
    label: "Sonde EGT"
    ref: "Thermocouple type K"
    type: "Thermocouple K, pointe isolée"
    connector: "Mini-K (thermocouple)"
    system: WBO
    node: N_EGT
    pins:
      "+": {fn: "K+ (chromel)"}
      "-": {fn: "K− (alumel)"}
    notes: "Rallonge en câble thermocouple type K jusqu'au CMC2, aucun fil cuivre."

  # ---------------- Papillon / pédale ----------------
  ETB:
    label: "Papillon motorisé"
    ref: "BMW 13547502444 — VDO 408-238-425-004Z"
    type: "DBW 6 fils (moteur + double piste)"
    connector: "BMW 6 voies (papillon M54)"
    system: DBW
    node: N_TB
    supply5_ma: 5
    pins:
      "1": {fn: "TPS 1"}
      "2": {fn: "+5 V", cls: V5}
      "3": {fn: "Moteur +"}
      "4": {fn: "TPS 2"}
      "5": {fn: "Moteur −"}
      "6": {fn: "Masse capteur", cls: GND_SENS}
    notes: "Brochage identique à la VDO 408-242 BMW documentée par MaxxECU. Si l'auto-calibration ferme le papillon au lieu de l'ouvrir : permuter motor + / motor − dans Output config (sans re-sertir H2/H4)."
    verify: "Au banc : R(3–5) ≈ quelques ohms (moteur) ; pistes 1 et 4 variables sous 5 V (2 +, 6 −)."
  APP:
    label: "Pédale d'accélérateur"
    ref: "Pédale BMW marquage 25916010"
    type: "Double piste (2 alims, 2 masses, 2 signaux)"
    connector: "TE MQS 6 voies"
    system: DBW
    node: CAB_PEDAL
    harness: CAB
    supply5_ma: 20
    pins:
      "1": {fn: "Masse piste 1", cls: GND_SENS}
      "2": {fn: "Masse piste 2", cls: GND_SENS}
      "3": {fn: "+5 V piste 2", cls: V5}
      "4": {fn: "Signal piste 1"}
      "5": {fn: "+5 V piste 1", cls: V5}
      "6": {fn: "Signal piste 2"}
    notes: "Brochage pédale BMW E46 6 voies. Sur BMW, la piste 2 vaut ~ la moitié de la piste 1."
    verify: "Au banc : 5 V sur 3 et 5, masse sur 1 et 2, mesurer 4 et 6 pédale relâchée / à fond."

  # ---------------- Injecteurs ----------------
  INJ1: &inj
    label: "Injecteur cyl. 1"
    ref: "870 cc Bosch EV1"
    type: "Injecteur 2 fils"
    connector: "Bosch EV1 / JPT 2 voies"
    system: INJ
    node: INT1
    load_a: 1.0
    pins:
      "1": {fn: "+12 V", cls: PWR12, supply: true}
      "2": {fn: "Commande ECU"}
    notes: "Pas de polarité, mais câbler les 6 dans le même sens."
    verify: "Mesurer la résistance : ≈ 12 Ω = haute impédance, ≈ 2–3 Ω = basse impédance (régler le type dans MTune)."
  INJ2: {<<: *inj, label: "Injecteur cyl. 2", node: INT2}
  INJ3: {<<: *inj, label: "Injecteur cyl. 3", node: INT3}
  INJ4: {<<: *inj, label: "Injecteur cyl. 4", node: INT4}
  INJ5: {<<: *inj, label: "Injecteur cyl. 5", node: INT5}
  INJ6: {<<: *inj, label: "Injecteur cyl. 6", node: INT6}

  # ---------------- Bobines ----------------
  COIL1: &coil
    label: "Bobine cyl. 1"
    ref: "Bosch 0 221 604 800"
    type: "Bobine crayon à allumeur intégré (commande 5 V)"
    connector: "VAG 4 voies (1J0 973 724)"
    system: IGN
    node: TOP1
    load_a: 1.0
    pins:
      "1": {fn: "+12 V", cls: PWR12, supply: true}
      "2": {fn: "Masse électronique", cls: GND_PWR}
      "3": {fn: "Commande IGN"}
      "4": {fn: "Masse puissance", cls: GND_PWR}
    notes: "Broches 2 et 4 jamais sur Sensor GND. Condensateur 10 µF près des bobines si parasites (préconisation MaxxECU)."
    verify: "Confirmer le repérage 1-2-3-4 moulé sur le connecteur de la bobine."
  COIL2: {<<: *coil, label: "Bobine cyl. 2", node: TOP2}
  COIL3: {<<: *coil, label: "Bobine cyl. 3", node: TOP3}
  COIL4: {<<: *coil, label: "Bobine cyl. 4", node: TOP4}
  COIL5: {<<: *coil, label: "Bobine cyl. 5", node: TOP5}
  COIL6: {<<: *coil, label: "Bobine cyl. 6", node: TOP6}

  # ---------------- Actionneurs ----------------
  MAC:
    label: "Électrovanne de boost"
    ref: "MAC 35A-ACA-DDBA-1BA 12 V"
    type: "Électrovanne 3 voies 12 V (≈ 5,4 W)"
    connector: "Superseal 1.5 2 voies (conseillé)"
    system: ACT
    node: N_MAC
    load_a: 0.45
    pins:
      "1": {fn: "+12 V", cls: PWR12, supply: true}
      "2": {fn: "Commande GPO1"}
    notes: "Fréquence PWM typique 30 Hz (à régler dans MTune)."
  VANOS:
    label: "Électrovanne VANOS"
    ref: "BMW 11361738494 (VANOS simple M50TU)"
    type: "Électrovanne tout-ou-rien"
    connector: "Bosch JPT 2 voies"
    system: ACT
    node: N_VANOS
    r_ohm: [8.5, 12]
    pins:
      "1": {fn: "+12 V", cls: PWR12, supply: true}
      "2": {fn: "Commande (masse)"}
    notes: "Sur M50 : VANOS tout-ou-rien. MaxxECU la câble en direct sur GPO3 (sans relais) sur son faisceau M50."
    verify: "Contrôle de 10 s : résistance attendue ≈ 8,5–12 Ω. Entre 3,6 et 7,5 Ω : commande sur INJ7 (CMC1 L2, 4 A continu). Sous 3,6 Ω : ni GPO ni INJ, VANOS par relais (bobine sur GPO3)."

  # ---------------- Charges châssis ----------------
  PUMP:
    label: "Pompe à essence"
    ref: "Pompe 280 l/h"
    type: "Charge forte (≈ 15 A estimés à 5 bar)"
    connector: "Selon pompe"
    system: RLY
    node: N_PUMP
    harness: CHS
    load_a: 15
    pins:
      "+": {fn: "+12 V", cls: PWR12, supply: true}
      "-": {fn: "Masse", cls: GND_PWR}
  FAN:
    label: "Ventilateur électrique"
    ref: "SPAL 385 mm aspirant (SPA-VE-385-A)"
    type: "12 V, 19,5 A (VA18-AP71/LL-59A), 3430 m³/h"
    connector: "Connecteur 2 voies du ventilateur"
    system: RLY
    node: N_FAN
    load_a: 19.5
    pins:
      "+": {fn: "+12 V", cls: PWR12, supply: true}
      "-": {fn: "Masse", cls: GND_PWR}
    notes: "Démarrage : appel de courant 2 à 3 fois le nominal pendant une fraction de seconde, absorbé par le fusible 30 A temporisé."

  # ---------------- Habitacle ----------------
  KEY:
    label: "Contacteur (30 / 15 / 50)"
    ref: "Contacteur à clé E36 ou interrupteur contact + bouton démarreur"
    type: "Contacteur : 30 entrée permanente, 15 contact mis, 50 démarrage"
    connector: "Selon contacteur (cosses 6,3 mm)"
    system: DEM
    node: CAB_KEY
    harness: CAB
    external: true
    switch: {"30": ["15", "50"]}
    pins:
      "30": {fn: "+30 entrée (permanent, fusible F11)", cls: PWR12}
      "15": {fn: "+15 contact mis (reste alimenté en position démarrage)", cls: V15, source: true}
      "50": {fn: "+50 démarrage (position démarreur)", cls: V50, source: true}
    notes: "Contacteur à clé E36 : 30, 15 et 50 sur ses cosses. Avec un interrupteur + bouton, le bouton démarreur prend le +15 et sort sur 50."
  CLUSTER:
    label: "Combiné (compte-tours)"
    ref: "Combiné E36 ou afficheur"
    type: "Entrée compte-tours"
    connector: "Selon véhicule"
    system: COM
    node: CAB_CLUSTER
    harness: CAB
    external: true
    pins:
      "TD": {fn: "Entrée régime"}
    notes: "Régler d'abord le pull-up interne de GPO8 (12 V) dans MTune ; seulement si l'aiguille ne bouge toujours pas : pull-up 1 kΩ / 1 W vers +12 V commuté sur ce fil."
  CANDEV:
    label: "Afficheur / logger CAN (option)"
    ref: "Option"
    type: "Bus CAN"
    connector: "Selon appareil"
    system: COM
    node: CAB_DASH
    harness: CAB
    external: true
    optional: true
    pins:
      "H": {fn: "CAN H"}
      "L": {fn: "CAN L"}
    notes: "Résistance 120 Ω déjà intégrée côté ECU : ajouter 120 Ω à l'autre extrémité du bus."

  # ---------------- Démarrage & charge ----------------
  STARTER:
    label: "Démarreur"
    ref: "Démarreur Bosch d'origine M50 (borne 50 = solénoïde)"
    type: "Solénoïde : appel ≈ 30–40 A pendant 50 ms, maintien ≈ 10 A"
    connector: "Cosse de la borne 50 (selon démarreur)"
    system: DEM
    node: N_START
    harness: ENG
    load_a: 10
    pins:
      "50": {fn: "Commande solénoïde (50)", cls: PWR12, supply: true}
    notes: "Borne 30 du démarreur : câble batterie d'origine (coffre) et câble B+ de l'alternateur, hors faisceau (voir nomenclature)."
  ALT:
    label: "Alternateur"
    ref: "Alternateur Bosch d'origine M50 (B+ et D+)"
    type: "Excitation par voyant de charge (D+ / 61)"
    connector: "Cosse / fiche D+ de l'alternateur"
    system: DEM
    node: N_ALT
    harness: ENG
    pins:
      "D+": {fn: "D+ excitation (61)"}
    notes: "Montage d'origine BMW : le +12 V contact traverse le voyant de charge et arrive sur D+. Voyant allumé contact mis, il s'éteint dès que l'alternateur charge. B+ : câble de charge vers la borne 30 du démarreur, hors faisceau."
    verify: "Repérer la borne D+ (fil bleu d'origine) sur ton alternateur avant de sertir."
  LAMP:
    label: "Voyant de charge"
    ref: "Voyant 12 V 2 W (ou LED + résistance 100 Ω 2 W en parallèle)"
    type: "Lampe de pré-excitation alternateur"
    connector: "Selon voyant"
    system: DEM
    node: CAB_DASH
    harness: CAB
    load_a: 0.17
    pins:
      "1": {fn: "+12 V commuté", cls: PWR12, supply: true}
      "2": {fn: "Sortie vers D+"}
    notes: "Une LED seule ne laisse pas passer assez de courant pour exciter l'alternateur : ampoule 2 W, ou LED avec une résistance de 100 Ω / 2 W en parallèle. Si tu gardes le combiné E36, son voyant de charge fait le même travail."

  # ---------------- Distribution d'énergie (PDM) ----------------
  BATT:
    label: "Borne B+ baie moteur"
    ref: "Borne de démarrage E36 (câble batterie du coffre)"
    type: "Source"
    connector: "Cosse œillet M8"
    system: PWR
    node: BPLUS
    harness: CHS
    external: true
    pins:
      "+": {fn: "+12 V batterie", cls: PWR12}
  F0:  {label: "Fusible général", ref: "MAXI 80 A", type: fuse, rating_a: 80, system: PWR, node: BPLUS, harness: CHS, connector: "Porte-fusible MAXI étanche", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F10: {label: "Fusible relais principal", ref: "30 A", type: fuse, rating_a: 30, system: PWR, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F1:  {label: "Fusible ECU", ref: "15 A", type: fuse, rating_a: 15, system: PWR, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F2:  {label: "Fusible bobines", ref: "15 A", type: fuse, rating_a: 15, system: IGN, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F3:  {label: "Fusible injecteurs", ref: "10 A", type: fuse, rating_a: 10, system: INJ, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F4:  {label: "Fusible chauffage lambda", ref: "10 A", type: fuse, rating_a: 10, system: WBO, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F5:  {label: "Fusible actionneurs (VANOS, MAC)", ref: "10 A", type: fuse, rating_a: 10, system: ACT, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F6:  {label: "Fusible capteur PMH", ref: "5 A", type: fuse, rating_a: 5, system: SYNC, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F7:  {label: "Fusible commandes (bobines relais pompe / ventilo, voyant de charge)", ref: "5 A", type: fuse, rating_a: 5, system: RLY, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F8:  {label: "Fusible pompe à essence", ref: "20 A", type: fuse, rating_a: 20, system: RLY, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F9:  {label: "Fusible ventilateur", ref: "30 A", type: fuse, rating_a: 30, system: RLY, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F11: {label: "Fusible contacteur (+30 clé)", ref: "5 A", type: fuse, rating_a: 5, system: DEM, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F12: {label: "Fusible démarreur (borne 50)", ref: "30 A", type: fuse, rating_a: 30, system: DEM, node: PDM, connector: "Boîte à fusibles étanche à 2 barrettes", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  K1:
    label: "Relais principal"
    ref: "Relais ISO mini 40 A"
    type: relay
    rating_a: 40
    system: PWR
    node: PDM
    connector: "Support de relais ISO mini étanche (lames 6,3 mm)"
    load_a: 0.15
    pins:
      "30": {fn: "Contact — entrée"}
      "87": {fn: "Contact — sortie"}
      "86": {fn: "Bobine +", cls: V15, supply: true}
      "85": {fn: "Bobine −", cls: GND_PWR}
  K2:
    label: "Relais pompe à essence"
    ref: "Relais ISO mini 30/40 A"
    type: relay
    rating_a: 30
    system: RLY
    node: PDM
    connector: "Support de relais ISO mini étanche (lames 6,3 mm)"
    load_a: 0.15
    pins:
      "30": {fn: "Contact — entrée"}
      "87": {fn: "Contact — sortie"}
      "86": {fn: "Bobine +", cls: PWR12, supply: true}
      "85": {fn: "Bobine − (GPO2)"}
  K3:
    label: "Relais ventilateur"
    ref: "Relais ISO mini 40 A"
    type: relay
    rating_a: 40
    system: RLY
    node: PDM
    connector: "Support de relais ISO mini étanche (lames 6,3 mm)"
    load_a: 0.15
    pins:
      "30": {fn: "Contact — entrée"}
      "87": {fn: "Contact — sortie"}
      "86": {fn: "Bobine +", cls: PWR12, supply: true}
      "85": {fn: "Bobine − (GPO6)"}
  K4:
    label: "Relais démarreur"
    ref: "Relais ISO mini 40 A"
    type: relay
    rating_a: 40
    system: DEM
    node: PDM
    connector: "Support de relais ISO mini étanche (lames 6,3 mm)"
    load_a: 0.15
    pins:
      "30": {fn: "Contact — entrée"}
      "87": {fn: "Contact — sortie vers borne 50"}
      "86": {fn: "Bobine + (50 clé)", cls: V50, supply: true}
      "85": {fn: "Bobine −", cls: GND_PWR}
    notes: "Le contacteur ne commande plus que la bobine (0,15 A) : le courant d'appel du solénoïde passe par le relais, au plus près de la batterie."

