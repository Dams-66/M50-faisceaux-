# =============================================================================
#  Faisceau moteur BMW M50B25 VANOS Turbo — MaxxECU RACE Gen1 (REV9+)
#  SOURCE UNIQUE DE VÉRITÉ : tout (planches, liste de coupe, nomenclature,
#  contrôles) est généré depuis ce fichier par tools/build_harness.py
#
#  Repères d'extrémité :  CMC1.A2  = ECU connecteur 1 broche A2
#                         COIL1.3  = composant COIL1 broche 3
#                         SPL-xxx  = épissure (pas de broche)
#                         C-xxx.SH = blindage du câble C-xxx
# =============================================================================

meta:
  project: "Faisceau moteur M50B25 VANOS Turbo"
  engine: "BMW M50B25 VANOS — turbo — BMW E36"
  ecu: "MaxxECU RACE Gen1 (REV9+)"
  revision: "C"
  date: "2026-10-08"
  status: "Étude — à valider sur véhicule"
  assumptions:
    - "BMW E36 conduite à gauche, caisse vide : faisceau entièrement neuf, aucun faisceau d'origine conservé."
    - "ECU et boîte fusibles/relais (PDM) dans l'habitacle, derrière la boîte à gants : la boîte électronique d'origine est côté échappement / turbo sur un M50 en E36."
    - "Faisceau moteur d'un seul tenant, traversée du tablier par un passe-fil étanche à l'emplacement de la boîte électronique d'origine."
    - "Longueurs de tronçons ESTIMÉES pour une baie E36 / M50 : à remplacer par des mesures à la ficelle (section topology)."
    - "Fusible général MAXI 80 A sur la borne B+ de la baie moteur (câble batterie d'origine depuis le coffre)."
    - "Pompe 280 l/h estimée à 15 A ; ventilateur SPAL 385 mm aspirant 19,5 A (fiche SPAL VA18-AP71/LL-59A) : à confirmer sur les étiquettes."
  sources:
    - {label: "MaxxECU RACE (REV9+) — schéma de câblage officiel", url: "https://www.maxxecu.com/files/Documentation/Wirings/MaxxECU%20RACE%20(REV9+)%20-%20Wiring-en.pdf"}
    - {label: "MaxxECU — faisceau BMW M50 (note culasse VANOS / capteur 12141726590)", url: "https://maxxecu.com/webhelp/wirings-terminated_engine_harness-bmw_m50.html"}
    - {label: "MaxxECU — brochages papillons électroniques (VDO BMW)", url: "https://maxxecu.com/webhelp/wirings-e-throttle_bodies.html"}
    - {label: "MaxxECU — BMW M54 plug-in (papillon sur GPO11/12, TPS + AIN3/4/5)", url: "https://maxxecu.com/webhelp/wirings-pluginecu-bmw_m54.html"}
    - {label: "MaxxECU RACE — caractéristiques (GPO 2 A, GPO9 5 A, INJ 8 A crête / 4 A continu, MAP 3 bar boost)", url: "https://maxxecu.com/products/race"}
    - {label: "MaxxECU — Injector output (8 A crête / 4 A continu par sortie)", url: "https://maxxecu.com/webhelp/output_functions-injector_output.html"}
    - {label: "Molex CMC 48 voies 64320 — plan SD-64320-001 (rangées A–K = CP 0.6, L–M = CP 1.5)", url: "https://www.farnell.com/cad/2790198.pdf"}
    - {label: "Bosch 0 261 544 01F — brochage 2 P / 3 +5V / 4 GND / 5 NTC", url: "https://en.oreca-store.com/bosch-0261-544-01f-u5g-fluid-pressure-and-temperature-sensor-0-10-bar-026154401fu5g.html"}
    - {label: "Haltech — moteur BMW M50 (capteurs, VANOS)", url: "https://support.haltech.com/portal/en/kb/articles/m50-engine"}
    - {label: "Électrovanne VANOS simple 11361738494 (M50TU / M52 / S50 / S52)", url: "https://www.bimmerworld.com/Engine/Camshafts/VANOS-Solenoid-Switch-E34-525i-93-95-E36-325i-M3-93-95-BMW-11361738494.html"}
    - {label: "SPAL 385 mm aspirant VA18-AP71/LL-59A — 12 V, 19,5 A", url: "https://www.bar-tek.com/fr/ventilateur-de-refroidissement-d414-d385-aspirant-spal"}

# -----------------------------------------------------------------------------
# Code couleur (IEC 60757). Modifie librement : tout est recalculé.
# -----------------------------------------------------------------------------
colors:
  RD: {name: "rouge", hex: "#d42a2a"}
  BK: {name: "noir", hex: "#1d1d1f"}
  BN: {name: "marron", hex: "#7a4a24"}
  OG: {name: "orange", hex: "#ef7d14"}
  YE: {name: "jaune", hex: "#f2cf1d"}
  GN: {name: "vert", hex: "#2a9a48"}
  BU: {name: "bleu", hex: "#2364c8"}
  VT: {name: "violet", hex: "#8040b0"}
  GY: {name: "gris", hex: "#8c9399"}
  WH: {name: "blanc", hex: "#f7f7f5"}
  PK: {name: "rose", hex: "#e874a8"}

color_legend:
  - {code: "RD", role: "+12 V permanent batterie (30), avant relais"}
  - {code: "RD/WH", role: "+12 V commuté : sorties fusibles après relais principal"}
  - {code: "VT", role: "+15 contact clé → bobine relais principal"}
  - {code: "BK", role: "Masse puissance (culasse / caisse)"}
  - {code: "BN", role: "Masses de référence ECU : Sensor GND, VR GND, Knock GND — JAMAIS à la caisse"}
  - {code: "OG", role: "+5 V capteurs (CMC1 G1)"}
  - {code: "YE", role: "Signaux température (NTC), rayure = capteur"}
  - {code: "WH", role: "Signaux analogiques 0–5 V et signaux capteurs, rayure = fonction"}
  - {code: "BU", role: "Commandes allumage IGN1→6"}
  - {code: "GY", role: "Commandes injecteurs INJ1→6"}
  - {code: "GN", role: "Sorties GPO (actionneurs, relais, chauffage lambda)"}
  - {code: "PK", role: "Moteur papillon (PK = +, PK/BK = −)"}
  - {code: "VT/YE", role: "Commande démarreur : 50 clé → relais K4 → solénoïde du démarreur"}
  - {code: "BU/RD", role: "Excitation alternateur : voyant de charge → D+ (61)"}

wire_rules:
  insulation: "FLRY-B (ou Tefzel / M22759 pour le haut de gamme)"
  slack_m: 0.10          # surlongueur ajoutée à chaque fil
  termination_m: 0.03    # longueur de dénudage / reprise par extrémité
  round_to_m: 0.05       # arrondi supérieur de la longueur de coupe
  # Section mini admissible derrière un fusible (FLRY-B, toron en baie moteur)
  fuse_min_mm2: {5: 0.35, 7.5: 0.5, 10: 0.75, 15: 1.0, 20: 1.5, 30: 2.5, 40: 4.0, 60: 6.0, 80: 10.0}
  # Diamètre extérieur par section (mm) pour le calcul des torons
  od_mm: {0.35: 1.3, 0.5: 1.6, 0.75: 1.9, 1.0: 2.1, 1.5: 2.4, 2.5: 3.0, 4.0: 3.7, 6.0: 4.3, 10.0: 5.6}
  fuse_load_warn_ratio: 0.8
  supply_v: 14.4
  rho_ohm_mm2_m: 0.0193   # cuivre à ~50 °C
  drop_ref_v: 13.5
  drop_min_a: 5           # charges analysées pour la chute de tension
  drop_warn_pct: 3

# -----------------------------------------------------------------------------
