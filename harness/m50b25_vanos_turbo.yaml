  F2:  {label: "Fusible bobines", ref: "15 A", type: fuse, rating_a: 15, system: IGN, node: PDM, connector: "Boîte à fusibles 10 voies", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F3:  {label: "Fusible injecteurs", ref: "10 A", type: fuse, rating_a: 10, system: INJ, node: PDM, connector: "Boîte à fusibles 10 voies", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F4:  {label: "Fusible actionneurs, capteur PMH et chauffage lambda", ref: "10 A", type: fuse, rating_a: 10, system: ACT, node: PDM, connector: "Boîte à fusibles 10 voies", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F5:  {label: "Fusible bobines des relais K2 (pompe) et K3 (ventilo) + voyant de charge", ref: "5 A", type: fuse, rating_a: 5, system: RLY, node: PDM, connector: "Boîte à fusibles 10 voies", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F6:  {label: "Fusible pompe à essence", ref: "20 A", type: fuse, rating_a: 20, system: RLY, node: PDM, connector: "Boîte à fusibles 10 voies", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F7:  {label: "Fusible ventilateur", ref: "30 A", type: fuse, rating_a: 30, system: RLY, node: PDM, connector: "Boîte à fusibles 10 voies", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F8:  {label: "Fusible relais principal", ref: "30 A", type: fuse, rating_a: 30, system: PWR, node: PDM, connector: "Boîte à fusibles 10 voies", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F9:  {label: "Fusible interrupteur de contact / bouton démarreur", ref: "5 A", type: fuse, rating_a: 5, system: DEM, node: PDM, connector: "Boîte à fusibles 10 voies", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  F10: {label: "Fusible démarreur (borne 50)", ref: "30 A", type: fuse, rating_a: 30, system: DEM, node: PDM, connector: "Boîte à fusibles 10 voies", pins: {"1": {fn: "Entrée"}, "2": {fn: "Sortie"}}}
  K1:
    label: "Relais principal"
    ref: "Relais ISO mini 40 A"
    type: relay
    rating_a: 40
    system: PWR
    node: PDM
    connector: "Support de relais ISO mini étanche (lames 6,3 mm)"
    load_a: 0.15
    pins:
