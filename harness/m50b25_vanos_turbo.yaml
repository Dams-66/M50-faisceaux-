    signal: true
    rating_a: 30
    system: COM
    node: PDM
    connector: "Support de relais ISO mini étanche (lames 6,3 mm)"
    load_a: 0.15
    rank: 100
    pins:
      "86": {fn: "Bobine + (sortie bouton 7 du pad)", cls: PWR12, supply: true}
      "85": {fn: "Bobine − (masse caisse)", cls: GND_PWR}
      "30": {fn: "Contact → entrée DIN4 (CMC2 F3)"}
      "87": {fn: "Contact → Sensor GND", cls: GND_SENS}
  K9:
