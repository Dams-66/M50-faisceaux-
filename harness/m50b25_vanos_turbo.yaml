# -----------------------------------------------------------------------------
# Audit du plan d'origine
# sev : fix (corrigé), add (ajouté), warn (à vérifier), ok (validé)
# -----------------------------------------------------------------------------
audit:
  - sev: fix
    title: "Retour du capteur AAC sur VR GND (CMC1 H2), pas sur Sensor GND (H1)"
    detail: "Sur le schéma officiel RACE REV9+, le capteur PMH et le capteur AAC (VR ou Hall) ont leur retour sur VR GND (H2) ; les blindages PMH, AAC et lambda vont sur SHIELD GND (E3), ceux des capteurs de cliquetis sur KNOCK GND (CMC2 E1, page 2 du schéma). Ton plan mettait la broche 2 de l'AAC sur H1. Les deux retours (PMH broche 3 + AAC broche 2) se rejoignent par l'épissure SPL-VRG au ras du connecteur."
  - sev: add
    title: "Alimentation et masses de l'ECU (absentes du plan)"
    detail: "CMC1 M4 = +12 V ECU (fusible 15 A après relais principal). CMC1 L4 ET CMC2 G4 = masses moteur, toutes deux au MÊME goujon de culasse (exigence MaxxECU). Relais principal commandé par le +15 de l'interrupteur de contact : la RACE Gen1 n'a pas de sortie de commande de relais principal."
  - sev: add
    title: "Boîte fusibles/relais complète (PDM)"
    detail: "Fusible général MAXI 80 A, 10 fusibles numérotés F1 à F10 sans trou (ta boîte 10 voies, si elle a 2 arrivées séparées) et 9 relais (K1 à K4 pour le moteur, K5 à K9 pour les boutons du pad) : chaque circuit a son fusible et chaque fil est protégé par un fusible adapté à sa section (contrôle automatique)."
  - sev: fix
    title: "Section des +12 V bobines : 1,0 mm² et non 0,75"
    detail: "Le fusible bobines est à 15 A (préconisation MaxxECU). Un fil de 0,75 mm² n'est protégé que jusqu'à 10 A : chaque dérivation bobine passe en 1,0 mm². Masses broche 4 (puissance) en 1,0 mm², broche 2 (électronique) en 0,75 mm²."
  - sev: ok
    title: "VANOS en direct sur GPO3, sans relais"
    detail: "C'est le câblage de MaxxECU sur son propre faisceau M50 : GPO3, connecteur Bosch JPT 2 voies, aucun relais. L'électrovanne simple VANOS 11361738494 (M50TU / M52 / S50 / S52) est relevée autour de 8,5–12 Ω, soit 1,2 à 1,7 A pour une limite GPO de 2 A. La valeur de 3,3 Ω qui circule vient d'un article sur le S50 du Z3 M, pas de cette électrovanne. Un contrôle de 10 s au multimètre reste conseillé : entre 3,6 et 7,5 Ω, passer sur INJ7 (CMC1 L2, 4 A en continu) ; sous 3,6 Ω, passer par un relais."
  - sev: add
    title: "ECU et fusibles dans l'habitacle (E36 caisse vide)"
    detail: "Sur un M50 en E36 conduite à gauche, la boîte électronique d'origine est côté échappement, donc côté turbo. ECU et boîte fusibles/relais passent derrière la boîte à gants, au frais et au sec ; le faisceau moteur traverse le tablier par un passe-fil étanche à l'emplacement d'origine. La pédale, l'interrupteur de contact, le bouton démarreur et le pad sont câblés en direct : plus de connecteur de cloison."
  - sev: add
    title: "Pompe 280 l/h et ventilateur SPAL 385 mm"
    detail: "Pompe : relais K2, fusible 20 A, alimentation et masse en 4 mm² pour limiter la chute de tension sur le trajet jusqu'au réservoir. Ventilateur SPAL 385 mm aspirant (19,5 A d'après la fiche SPAL VA18-AP71/LL-59A) : relais K3 40 A, fusible 30 A, fils 4 mm². Les deux sont alimentés en direct batterie, hors relais principal."
  - sev: fix
    title: "Révision C : audit électrique indépendant"
    detail: "Quatre relectures séparées (alimentation et masses, brochage ECU, brochage des composants, fabrication), chaque point contre-vérifié. Corrigé : chauffage lambda D1 en 0,75 mm² (petite alvéole CMC) ; sorties injecteur à 4 A en continu ; blindages de cliquetis sur KNOCK GND ; fusibles en 2 groupes (+30 permanent / +87 commuté) et supports de relais séparés ; contacts, bouchons et épissures dimensionnés ; connecteur lambda côté faisceau et côté froid ; protection thermique côté turbo ; +12 V du capteur PMH hors câble blindé ; notes MTune (pull-up du trigger, papillon, chauffage, compte-tours)."
  - sev: add
    title: "Révision D : contact sans clé, pad 8 boutons"
    detail: "Plus de clé : un interrupteur de contact alimenté par F9 donne le +15 (relais principal K1) et alimente le bouton démarreur mécanique, qui commande K4 ; le démarreur ne peut donc pas être lancé contact coupé. F9 reste nécessaire : c'est lui qui protège le fil qui va de la barrette +30 jusqu'à l'interrupteur. Plus de combiné : la sortie compte-tours (GPO8, CMC1 A4) est libre. Le bouton 8 arrête le moteur (Stop engine/prevent start) sans couper le contact : l'ECU reste alimentée et continue de piloter le ventilateur pour refroidir."
  - sev: add
    title: "Révision E : fusibles F1 à F10, relais du pad"
    detail: "Les fusibles sont renumérotés F1 à F10 sans trou, pour ta boîte 10 voies. Anciens → nouveaux : F1, F2, F3 inchangés ; F4 (chauffage lambda) et F5 (VANOS, MAC, capteur PMH) regroupés en F4 ; l'emplacement F6, déjà vide en révision D, disparaît ; F7 → F5 ; F8 → F6 ; F9 → F7 ; F10 → F8 ; F11 → F9 ; F12 → F10. Les boutons 4 à 8 du pad commandent 5 relais (K5 à K9) qui mettent les entrées DIN3, DIN1, DIN2, DIN4 et DIN5 à la masse capteurs : c'est le câblage « interrupteur → masse » du plan MaxxECU, pull-up des entrées activé, sans aucune résistance."
  - sev: warn
    title: "Boîte 10 voies : 2 arrivées séparées obligatoires"
    detail: "F1 à F5 ne doivent recevoir que PWR-04 (sortie du relais principal K1), F6 à F10 que PWR-02 (+12 V permanent). Ne jamais relier ces deux arrivées sur la même barrette : alimentée en permanent, l'ECU, les bobines et les injecteurs resteraient sous tension contact coupé (le moteur ne s'arrêterait plus à l'interrupteur et la batterie se viderait) ; alimentée par K1, le fusible F8 qui alimente K1 se retrouverait derrière K1 et rien ne démarrerait. Si ta boîte n'a qu'une barrette commune : elle ne reçoit que F1 à F5, et F6 à F10 vont dans 5 porte-fusibles séparés (nomenclature). L'arrivée du groupe permanent porte ≈ 52 A en continu : 60 A au moins et cosse pour œillet 10 mm²."
  - sev: warn
    title: "F4 commun : un court-circuit VANOS, MAC ou chauffage lambda arrête le moteur"
    detail: "Le capteur PMH partage F4 avec la VANOS, la MAC et le chauffage de la sonde lambda. Un court-circuit sur l'un d'eux fait fondre F4 et coupe aussi le capteur PMH : le moteur cale, alors qu'avec des fusibles séparés il continuait à tourner. Le fil du chauffage lambda longe l'échappement : soigner sa protection thermique et sa fixation. C'est le prix de 2 fusibles en moins."
  - sev: warn
    title: "Bouton 8 : moteur arrêté, contact mis = batterie qui se vide"
    detail: "Moteur arrêté par le bouton 8, l'alternateur ne charge plus (voyant de charge allumé, c'est normal) alors que le ventilateur tire 19,5 A, plus ECU, papillon et relais : environ 22 A, soit à peu près 2 Ah pour 5 minutes. La pompe à essence, elle, s'arrête seule (MaxxECU coupe sa sortie dès que le signal PMH disparaît). Couper le contact une fois le moteur refroidi."
  - sev: warn
    title: "Entrées digitales toutes occupées par le pad"
    detail: "Les 5 entrées digitales (DIN1 à DIN5) sont prises par les boutons. DIN1, DIN2, DIN4 et DIN5 sont aussi les seules capables de lire un capteur de vitesse de roue ou de boîte (VR / Hall) : si tu en ajoutes un plus tard, le bouton le moins utile devra passer sur AIN8 (CMC2 F2), avec une résistance de rappel vers +5 V puisque cette entrée n'a pas de pull-up. Pas de maintien d'alimentation (power hold) non plus : il demanderait une entrée « Ignition key ». Pour refroidir moteur arrêté, on utilise le bouton 8 (arrêt moteur, contact laissé mis)."
  - sev: add
    title: "Contact, démarreur et alternateur ajoutés (oubli de la révision B)"
    detail: "Caisse vide : rien n'alimentait le contacteur, le démarreur ni l'excitation de l'alternateur. Ajouts : F9 5 A alimente la borne 30 du contacteur ; la borne 50 commande un relais de démarreur K4 (fusible F10 30 A, 2,5 mm² jusqu'au solénoïde) ; l'alternateur est excité comme d'origine, par un voyant de charge 2 W entre le +12 V commuté et D+. Les gros câbles (batterie → démarreur, B+ alternateur → démarreur, tresses de masse) sont listés dans la nomenclature, hors faisceau."
  - sev: add
    title: "Épissures obligatoires"
    detail: "Une alvéole CMC ne reçoit qu'un fil. +5 V, Sensor GND, VR GND, Knock GND et Shield GND passent par des épissures dédiées, placées au ras de l'ECU pour les références et sur la branche moteur pour les distributions."
  - sev: ok
    title: "Brochage ECU conforme au schéma officiel RACE REV9+"
    detail: "IGN1→6 (A2, A3, B2, B3, C2, C3), INJ1→6 (K1, K2, M1, M2, M3, L3), GPO1/2/3/6 (B4, C4, D4, B1), entrées DIN1 à DIN5 du pad (K3, K4, C1, CMC2 F3/F4), lambda (G3, F3, D1, G4, F4), cliquetis (CMC2 E1/E2/E3, blindages sur KNOCK GND E1), EGT1 (CMC2 C1/D1), AIN5-7 (CMC2 G3, E4, F1), moteur papillon (CMC2 H4 + / H2 −) : tout est conforme."
  - sev: ok
    title: "Capteur AAC 12141726590 = bonne solution pour une culasse VANOS"
    detail: "MaxxECU indique : capteur VANOS d'origine (Hall 12 V) incompatible avec son câblage, solution recommandée = capteur 12141726590 (broche 1 signal, 2 masse, 3 blindage). Aucun +12 V sur ce capteur."
  - sev: ok
    title: "Papillon et pédale : affectation identique au plug-in MaxxECU M54"
    detail: "MaxxECU câble le M54 avec le papillon sur GPO11/12 (= Motor 1 −/+) et les pistes sur TPS + AIN3/4/5, exactement ton choix. Brochage papillon identique à la VDO 408-242 BMW documentée par MaxxECU."
  - sev: ok
    title: "Capteurs Bosch 0 261 544 01F"
    detail: "Brochage confirmé : 1 non assignée, 2 pression (0,5–4,5 V = 0–10 bar), 3 +5 V, 4 masse, 5 NTC."
  - sev: ok
    title: "Lambda LSU 4.9 sur contrôleur interne"
    detail: "Brochage conforme au schéma MaxxECU (vue côté câble) : 1 IP → G3, 2 COM → F3, 3 chauffage − → D1, 4 +12 V, 5 RCAL → G4, 6 VS → F4. Vérifie que ton boîtier est bien REV9 ou plus (étiquette)."
  - sev: warn
    title: "Capteur PMH Hall M52 sur cible 60-2 du M50"
    detail: "Le M50 d'origine utilise un capteur inductif en face de la cible 60-2 avant. Le capteur M52 (Hall, 12 V) demande un support et un entrefer adaptés. Dans MTune : entrée trigger en mode Digital (hall), pull-up interne activé (sinon pas de régime, pas de démarrage)."
  - sev: warn
    title: "Une seule alimentation +5 V et une seule Sensor GND"
    detail: "La RACE Gen1 n'a qu'un +5 V (G1) et qu'une Sensor GND (H1) : pédale et papillon les partagent. C'est normal ; un court-circuit sur le +5 V fait passer le papillon en sécurité. Consommation totale estimée ≈ 45 mA."
  - sev: fix
    title: "Alvéoles CMC : chauffage lambda (D1) en 0,75 mm²"
    detail: "CMC1 (Molex 64320) : rangées A à K = petites alvéoles CP 0.6 (0,75 mm² maxi), rangées L et M = grandes alvéoles CP 1.5. CMC2 (Molex 64319) : rangées A à F = CP 0.6, G et H = CP 1.5. Le fil de chauffage lambda en D1 était en 1,0 mm² : impossible à sertir et à étancher, il passe en 0,75 mm². Contacts : 64322-1039 pour 0,5 mm² et 64322-1029 pour 0,75 mm² en petite alvéole (K1, K2, B4, D4, D1) ; 64323-1029 pour 0,5–1 mm² et 64323-1039 pour 1–2 mm² en grande alvéole (L4, CMC2 G4). Bouchons 64325-1010 / 64325-1023 sur les alvéoles vides."
  - sev: ok
    title: "Injecteurs 870 cc"
    detail: "La RACE a 8 sorties injecteur peak & hold (8 A crête, 4 A en continu) : haute ou basse impédance acceptées. Mesure la résistance pour régler le type dans MTune."
  - sev: ok
    title: "MAP interne"
    detail: "Capteur interne MaxxECU RACE : jusqu'à 3 bar de pression de suralimentation. Durite directe depuis le plénum, aucun câblage."

# -----------------------------------------------------------------------------
# Réglages MTune liés au câblage
# -----------------------------------------------------------------------------
mtune:
  - {item: "Trigger", value: "60-2 vilebrequin sur TRIGGER H3 : Sensor type = Digital (hall), Trigger pullup resistor = ACTIVÉ (1 kΩ interne vers +5 V), seuils par défaut ; front à valider à l'oscilloscope MTune"}
  - {item: "Home / cam", value: "Capteur inductif (VR) sur HOME H4"}
  - {item: "Injecteurs", value: "INJ1→6 séquentiel ; type selon résistance mesurée (haute / basse impédance)"}
  - {item: "Allumage", value: "IGN1→6, bobines à allumeur intégré (sortie active 5 V) ; dwell selon doc bobine"}
  - {item: "E-throttle", value: "Output config : GPO12 (CMC2 H4) = E-throttle 1 motor +, GPO11 (CMC2 H2) = E-throttle 1 motor − ; entrées : TPS G2 = E-throttle 1 position MAIN, AIN3 J3 = position BACKUP, AIN4 J4 = pedal position MAIN, AIN5 CMC2 G3 = pedal position BACKUP"}
  - {item: "CLT / IAT", value: "Courbes Bosch NTC"}
  - {item: "AIN1 / AIN2 (temp.)", value: "Température huile / essence, NTC Bosch du 0 261 544 01F"}
  - {item: "AIN6 / AIN7", value: "Pression huile / essence 0,5–4,5 V = 0–10 bar"}
  - {item: "Knock", value: "Knock 1 (cyl. 1-2-3) et Knock 2 (cyl. 4-5-6)"}
  - {item: "Lambda", value: "Output config : GPO9 (CMC1 D1) = internal lambda sensor heater (sensor 1) ; WBO2 interne, capteur Bosch LSU 4.9 sélectionné AVANT la première mise sous tension sonde montée"}
  - {item: "EGT", value: "EGT1 type K"}
  - {item: "GPO1", value: "Boost control (MAC), PWM ~30 Hz"}
  - {item: "GPO2", value: "Fuel pump (relais K2)"}
  - {item: "GPO3", value: "VANOS tout-ou-rien (seuil de régime / charge à définir sur la cartographie)"}
  - {item: "GPO6", value: "Engine fan (relais K3)"}
  - {item: "Pad : réglages communs", value: "Inputs → Digital inputs, DIN1, DIN2, DIN4, DIN5 : Input type = Digital input (jamais VR), Pullup = ON (1 kΩ vers +5 V), Latch = None, Active level = falling (actif quand le relais met l'entrée à la masse) sauf ALS off. DIN3 : Outputs → Output config, GPO7 = Digital input 3 (pull-up +5 V fixe), puis Active level = falling. Vérifier qu'il reste au moins 2 Internal outputs libres"}
  - {item: "DIN3 (CMC1 C1) — bouton 4", value: "Ventilation forcée : Function = Fan override input. GPO6 reste en Radiator FAN 1 ; l'override passe outre la température et « disable fan when engine off », mais seulement ECU alimentée"}
  - {item: "DIN1 (CMC1 K3) — bouton 5", value: "Changement de carto : Function = Boost target switch (use table 2), Boost control → target tables = Dual table (switch activated). Internal output 1 : condition DIN 1 Active = 1 → Input to control = Extra ignition table 1 activation switch, Additional input = Extra fuel table 1 activation switch ; tables extra en « … when input active ». Ne pas utiliser « Extra fuel/ign table activation switch (all) » : il déclencherait aussi la table de chauffe"}
  - {item: "DIN2 (CMC1 K4) — bouton 6", value: "ALS off : Motorsport → Anti-lag, Enable method = Switch input ; DIN2 Function = Anti-lag enable, Active level = rising : ALS autorisé bouton éteint (relais ouvert, entrée à 5 V), coupé bouton allumé. Attention : pad éteint, pad redémarré éteint, fusible du pad grillé ou fil coupé = ALS autorisé. Plus sûr : Active level = falling et le bouton devient « ALS ON » (aucun recâblage). Garder Min CLT, Max EGT et le timeout"}
  - {item: "DIN4 (CMC2 F3) — bouton 7", value: "Carto de chauffe : Internal output 2, condition A = DIN 4 Active, condition B = Coolant temp < 70 °C (hystérésis 5 °C), Output function = A and B → Input to control = RPM limit, use secondary limit RPM (Rev limit RPM source = Two values, switch activated, ex. 4000 tr/min), Additional input = Extra ignition table 2 activation switch. Le mode s'arrête seul une fois chaud ; enrichissement et ralenti de chauffe restent automatiques"}
  - {item: "DIN5 (CMC2 F4) — bouton 8", value: "Arrêt moteur : Function = Stop engine/prevent start, Active level = falling, Latch = None. Doc MaxxECU : « engine will not start or will be stopped if running ». L'ECU reste alimentée ; la pompe s'arrête seule (sortie coupée dès la perte du signal PMH)"}
  - {item: "Ventilateur moteur arrêté", value: "Engine fan : « disable fan when engine off » = NON (sinon le ventilateur s'arrête avec le moteur) ; Start temperature réglée comme d'habitude. Le bouton 4 (Fan override input) force le ventilateur dans tous les cas"}
# -----------------------------------------------------------------------------
# Contrôles (cochables dans la page)
# -----------------------------------------------------------------------------
checks:
  - phase: "Au banc, avant sertissage"
    items:
      - "Papillon : R entre broches 3 et 5 = quelques ohms (moteur) ; sous 5 V (2 +, 6 −), relever les tensions des pistes 1 et 4 fermé / ouvert à la main."
      - "Pédale : 5 V sur 3 et 5, masse sur 1 et 2 ; relever 4 et 6 relâchée / à fond (piste 2 ≈ moitié de la piste 1)."
      - "Électrovanne VANOS : résistance ≈ 8,5–12 Ω (entre 3,6 et 7,5 Ω : commande sur INJ7 / L2 ; sous 3,6 Ω : relais)."
      - "Pompe et ventilateur : relever le courant nominal sur l'étiquette, ajuster load_a dans le fichier si besoin."
      - "Injecteurs : mesurer la résistance (≈ 12 Ω haute impédance / ≈ 2–3 Ω basse impédance)."
      - "AAC : résistance 1–2 de quelques centaines d'ohms ; continuité broche 3 ↔ corps (décide du raccord du blindage côté capteur)."
      - "IAT / CLT / NTC des capteurs huile et essence : ≈ 2–3 kΩ à 20 °C."
      - "Capteur PMH : confirmer alim / signal / masse sur sa doc ou par essai (12 V + pull-up, passage d'une pièce acier) ; dans MTune, pull-up du trigger activé."
      - "Bobines : confirmer le repérage 1-2-3-4 moulé sur le connecteur."
      - "Vérifier l'étiquette de la RACE : REV9 ou plus (LSU 4.9)."
      - "Pad : boutons 4 à 7 en mode Toggle (LED rouge), bouton 8 en mode Momentary (LED bleue), fusibles de ces 5 circuits remplacés par du 5 A ; bouton allumé = +12 V sur la sortie, éteint = 0 V ou circuit ouvert."
      - "Relais K5 à K9 : bobine 86–85 ≈ 70–90 Ω ; contact 30–87 ouvert au repos, fermé bobine sous 12 V."
      - "Boîte à fusibles : les arrivées du groupe F1 à F5 et du groupe F6 à F10 sont isolées l'une de l'autre (multimètre en continuité)."
  - phase: "Faisceau terminé, ECU débranchée"
    items:
      - "Continuité fil par fil avec la liste de coupe (chaque repère d'extrémité)."
      - "Sensor GND (CMC1 H1) ↔ caisse : circuit ouvert."
      - "VR GND (H2), Knock GND (CMC2 E1), Shield GND (E3) ↔ caisse : circuit ouvert."
      - "+5 V (G1) ↔ toutes les masses : pas de court-circuit."
      - "+12 V commuté (barrette 87) ↔ masse : pas de court-circuit."
      - "Barrette 30 (F6 à F10) ↔ barrette 87 (F1 à F5) : circuit ouvert."
      - "CMC1 L4 et CMC2 G4 ↔ goujon culasse : < 0,1 Ω."
      - "Batterie − ↔ caisse (coffre) ET tresse moteur ↔ caisse présentes et serrées (≥ 25 mm²) : sur E36 la batterie est au coffre, tout le retour passe par la caisse (exigence MaxxECU)."
      - "Passe-fil du tablier étanche, faisceau maintenu sans frottement sur la tôle."
      - "Blindages : reliés uniquement côté ECU (aucune continuité vers le moteur)."
      - "Pad allumé, boutons 4 à 8 un par un : continuité entre CMC1 H1 (masse capteurs) et, dans l'ordre, CMC1 C1, K3, K4, CMC2 F3, F4 ; circuit ouvert bouton éteint."
  - phase: "Première mise sous tension (pompe et injecteurs débranchés)"
    items:
      - "Interrupteur de contact sur ON : relais principal colle, +12 V sur CMC1 M4, voyant de charge allumé."
      - "Contact coupé : K1 décollé, 0 V en sortie de F1 à F5 et sur CMC1 M4 ; +12 V en sortie de F6 à F10."
      - "Bouton démarreur appuyé, contact mis : K4 colle et la borne 50 du démarreur reçoit le +12 V (injecteurs débranchés). Contact coupé : le bouton ne fait rien."
      - "MTune, pad : chaque bouton 4 à 8 fait changer d'état son entrée (DIN3, DIN1, DIN2, DIN4, DIN5) ; pad éteint, ≈ 5 V sur chaque broche (pull-up activé) et toutes les fonctions inactives, ALS mis à part (autorisé bouton éteint)."
      - "Bouton 8 moteur tournant : le moteur s'arrête, l'ECU reste allumée et le ventilateur continue selon la température (ou forcé par le bouton 4) ; bouton relâché, le démarreur relance le moteur."
      - "Moteur tournant : ventilateur, ALS, table de boost et tables extra suivent chaque bouton dans RealTime Data."
      - "Moteur tournant : voyant de charge éteint, 13,8–14,4 V aux bornes de la batterie."
      - "En lançant le démarreur : moins de 0,2 V entre la borne − de la batterie et le goujon GP-HEAD (sinon tresse moteur ↔ caisse à reprendre)."
      - "5,0 V mesurés au connecteur papillon et aux capteurs de pression."
      - "MTune : températures plausibles, pressions à 0 bar, TPS / pédale 0 → 100 %."
      - "Calibration E-throttle : sens d'ouverture correct (sinon permuter motor + / − dans Output config)."
      - "Test des sorties : chaque injecteur claque, VANOS, MAC, relais pompe et ventilateur collent."
      - "Test bobines : étincelle sur bougie à la masse, dans l'ordre 1-5-3-6-2-4."
      - "Démarreur, bobines et injecteurs débranchés : signaux trigger / home propres dans l'oscilloscope MTune."
      - "Premier démarrage : calage contrôlé à la lampe stroboscopique (offset trigger)."
