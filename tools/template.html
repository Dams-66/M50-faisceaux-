<style>
/* Layout: engineering-drawing title block over a tabbed workshop binder; on phones a thumb-reach bottom bar, drawings open in a pan/zoom viewer. */
:root {
  color-scheme: light;
  --paper: #eceff0;
  --sheet: #fbfcfc;
  --sheet-2: #f1f4f5;
  --ink: #14202a;
  --ink-2: #4a5864;
  --muted: #5f6d78;
  --rule: #d2dade;
  --rule-strong: #9fb0ba;
  --accent: #0f6b8c;
  --accent-ink: #ffffff;
  --tag: #f4cc2e;
  --tag-ink: #1d1700;
  --good: #0ca30c;
  --warn: #fab219;
  --bad: #d03b3b;
  --good-ink: #0a6e0a;
  --warn-ink: #8a5a00;
  --bad-ink: #a92a2a;
  --wire-edge: #26323b;
  --scrim: rgba(10, 16, 20, 0.45);
  --shadow: rgba(10, 16, 20, 0.18);
  --fam-fire: #2a78d6;
  --fam-wbo: #eb6834;
  --fam-sens: #1baf7a;
  --fam-dbw: #eda100;
  --fam-out: #e87ba4;
  --fam-pwr: #008300;
  --fam-ref: #9fb0ba;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bnav-h: 0px;
  --sticky-top: calc(env(safe-area-inset-top, 0px) + 50px);
  --dock-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0d1215; --sheet: #151c21; --sheet-2: #1b242a; --ink: #e4eaee; --ink-2: #a5b3bd;
    --muted: #93a1ad; --rule: #28333b; --rule-strong: #3f4d57; --accent: #5ab8db; --accent-ink: #06202b;
    --good-ink: #46cf5e; --warn-ink: #f4c04a; --bad-ink: #f07a74; --wire-edge: #a3b2bc;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: rgba(0, 0, 0, 0.5);
    --fam-fire: #3987e5; --fam-wbo: #d95926; --fam-sens: #199e70; --fam-dbw: #c98500; --fam-out: #d55181;
    --fam-pwr: #008300; --fam-ref: #3f4d57;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0d1215; --sheet: #151c21; --sheet-2: #1b242a; --ink: #e4eaee; --ink-2: #a5b3bd;
  --muted: #93a1ad; --rule: #28333b; --rule-strong: #3f4d57; --accent: #5ab8db; --accent-ink: #06202b;
  --good-ink: #46cf5e; --warn-ink: #f4c04a; --bad-ink: #f07a74; --wire-edge: #a3b2bc;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: rgba(0, 0, 0, 0.5);
  --fam-fire: #3987e5; --fam-wbo: #d95926; --fam-sens: #199e70; --fam-dbw: #c98500; --fam-out: #d55181;
  --fam-pwr: #008300; --fam-ref: #3f4d57;
}
html { scroll-padding-top: calc(var(--sticky-top) + var(--tool-h, 0px) + 8px); scroll-padding-bottom: calc(var(--bnav-h) + var(--dock-h) + 8px); }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-body); }
* { box-sizing: border-box; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button, a, summary, label { -webkit-tap-highlight-color: color-mix(in srgb, var(--accent) 18%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs button.tab-btn:focus-visible, .card > summary:focus-visible, .segsw button:focus-visible, .cut-tbl .wid:focus-visible { outline-offset: -3px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; }
@media (min-width: 900px) { .wrap { padding-inline: 28px; } }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
svg.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.m-flex, .m-block { display: none !important; }

/* ---------- Cartouche ---------- */
.tb { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); border: 1.5px solid var(--ink); background: var(--sheet); }
.tb-main { padding: 18px 20px 16px; border-right: 1.5px solid var(--ink); min-width: 0; }
.eyebrow { font: 600 11.5px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
h1 { font: 700 clamp(28px, 5.4vw, 52px)/0.95 var(--font-display); text-transform: uppercase; letter-spacing: .01em; margin: 10px 0 8px; text-wrap: balance; }
.tb-sub { margin: 0; color: var(--ink-2); }
.tb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; }
.tb-grid > div { padding: 9px 12px; border-bottom: 1px solid var(--rule-strong); min-width: 0; }
.tb-grid > div:nth-child(odd) { border-right: 1px solid var(--rule-strong); }
.tb-grid > div:nth-last-child(-n+2) { border-bottom: 0; }
.tb-grid dt { font: 600 10.5px/1.2 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tb-grid dd { margin: 3px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@media (max-width: 780px) { .tb { grid-template-columns: 1fr; } .tb-main { border-right: 0; border-bottom: 1.5px solid var(--ink); } }
.mhead { display: none; }

/* ---------- Onglets (bureau) ---------- */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; align-items: stretch; gap: 2px; background: var(--paper); border-bottom: 1.5px solid var(--ink); margin-top: 18px; }
.tabs-scroll { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.tabs button.tab-btn { font: 600 15.5px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; padding: 15px 13px 13px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.tabs button.tab-btn:hover { color: var(--ink); }
.tabs button.tab-btn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .srch { align-self: center; width: clamp(200px, 21vw, 290px); flex: none; margin-left: 8px; }
.tabs-go { display: none; align-self: center; margin-left: 6px; }
@media (max-width: 1099px) { .tabs-go { display: inline-grid; } }
.tabs-scroll.ovf-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); }
.tabs-scroll.ovf-l { -webkit-mask-image: linear-gradient(90deg, transparent, #000 44px); mask-image: linear-gradient(90deg, transparent, #000 44px); }
.tabs-scroll.ovf-l.ovf-r { -webkit-mask-image: linear-gradient(90deg, transparent, #000 44px, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(90deg, transparent, #000 44px, #000 calc(100% - 44px), transparent); }
@media (max-width: 1099px) { .tabs .srch { display: none; } }
.tab { padding-top: 22px; }
h2 { font: 700 26px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .02em; margin: 0 0 12px; text-wrap: balance; }
h3 { font: 600 19px/1.15 var(--font-display); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 8px; }
.lede { color: var(--ink-2); max-width: 70ch; margin: -4px 0 16px; }
.stack { display: grid; gap: 22px; }
.cols-2 { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 18px; min-width: 0; }

/* ---------- Téléphone : en-tête compact + barre du bas ---------- */
.bnav { display: none; }
@media (max-width: 760px), (max-height: 520px) and (pointer: coarse) {
  :root { --bnav-h: calc(60px + max(env(safe-area-inset-bottom, 0px), 4px)); --sticky-top: env(safe-area-inset-top, 0px); }
  body { padding-bottom: calc(var(--bnav-h) + var(--dock-h)); }
  .wrap { padding-block: 0 28px; }
  .m-flex { display: flex !important; }
  .m-block { display: block !important; }
  .d-only { display: none !important; }
  .tabs { display: none; }
  .mhead { display: flex; align-items: center; gap: 10px; padding: 10px 0; min-height: 60px; border-bottom: 1.5px solid var(--ink); }
  .mhead .mh-txt { flex: 1; min-width: 0; display: grid; }
  .mhead .mh-h1 { margin: 0; font: 700 20px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
  .mhead small { font: 500 11.5px/1.4 var(--font-mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mhead small .chip { font-size: 10px; padding: 2px 5px; }
  body:not([data-tab="synthese"]) .tb { display: none; }
  .tb { margin-top: 14px; }
  .tb-main { padding: 14px 16px 12px; }
  .tab { padding-top: 14px; }
  h2 { font-size: 24px; }
  .bnav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--sheet); border-top: 1.5px solid var(--ink); padding-bottom: max(env(safe-area-inset-bottom, 0px), 4px); }
  .bnav button { position: relative; display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 60px; padding: 6px 2px; border: 0; background: none; color: var(--ink-2); font: 600 12.5px/1.05 var(--font-display); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; min-width: 0; }
  .bnav button span.l { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bnav button[aria-current="page"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
  .bnav svg.ic { width: 24px; height: 24px; }
  .bnav .badge { position: absolute; top: 5px; left: calc(50% + 8px); font: 600 9.5px/1 var(--font-mono); letter-spacing: 0; padding: 2px 4px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); }
  .kb .bnav { display: none; }
  .tall-frame .bnav { display: none; }
  .tall-frame .tabs { display: flex; }
}
/* Téléphone en paysage : barre du bas et en-tête plus bas, plan à la hauteur de l'écran */
@media (max-height: 520px) and (pointer: coarse) {
  :root { --bnav-h: calc(48px + env(safe-area-inset-bottom, 0px)); }
  .wrap { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  .bnav { padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .bnav button { display: flex; justify-content: center; align-items: center; min-height: 48px; gap: 8px; padding: 4px 6px; }
  .bnav svg.ic { width: 20px; height: 20px; }
  .bnav .badge { top: 2px; left: auto; right: 2px; }
  .mhead { min-height: 50px; padding: 4px 0; }
  .viewer .vw-stage { height: var(--stage-h, max(200px, calc(100svh - var(--bnav-h) - 76px))); }
}

/* ---------- Puces ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; }
.chip.good { color: var(--good-ink); }
.chip.warn { color: var(--warn-ink); }
.chip.bad { color: var(--bad-ink); }
.chip.fix { color: var(--accent); }
.chip.add { color: var(--ink-2); }
.chip.info { color: var(--muted); }

/* ---------- Synthèse ---------- */
.checklist-v { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checklist-v li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; }
.audit { display: grid; gap: 10px; }
.audit article { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; padding: 13px 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
.audit article h3 { font: 600 16px/1.3 var(--font-body); text-transform: none; letter-spacing: 0; margin: 0 0 4px; }
.audit article p { margin: 0; color: var(--ink-2); max-width: 82ch; }
.audit details > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 16px; min-height: 48px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; font-weight: 600; }
.audit details > summary::-webkit-details-marker { display: none; }
.audit details > summary::after { content: "▾"; margin-left: auto; color: var(--muted); }
.audit details[open] > summary::after { content: "▴"; }
.audit details[open] > summary { margin-bottom: 10px; }
.audit details > div { display: grid; gap: 10px; }
@media (max-width: 560px) { .audit article { grid-template-columns: 1fr; gap: 8px; } }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.quick { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.quick button { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; text-align: left; padding: 14px 16px; min-height: 64px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); cursor: pointer; }
.quick button:hover { border-color: var(--ink); }
.quick button svg.ic { grid-row: span 2; color: var(--accent); width: 26px; height: 26px; }
.quick button strong { font: 600 16px/1.2 var(--font-display); letter-spacing: .04em; text-transform: uppercase; }
.quick button small { color: var(--muted); font-size: 12.5px; }

/* ---------- Tableaux ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { font: 600 10.5px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 9px 10px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; background: var(--sheet); }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.group td { background: var(--sheet-2); font: 600 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.tbl .fn { color: var(--ink-2); font-size: 12.5px; }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl tbody tr.clickable:hover td { background: var(--sheet-2); }
.tbl tr.done td { color: var(--muted); }
.tbl tr.done .wid { background: var(--rule); color: var(--ink-2); text-decoration: line-through; }
.flash, .tbl tr.flash td { outline: 3px solid var(--accent); outline-offset: -3px; }
@container (max-width: 640px) { .cards-m .tbl tr.flash td { outline: none; } }
.sw { display: inline-block; width: 26px; height: 12px; border-radius: 3px; border: 1px solid color-mix(in srgb, var(--ink) 55%, transparent); vertical-align: -1px; flex: none; }
.cc { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.wid { font: 600 12.5px var(--font-mono); background: var(--tag); color: var(--tag-ink); padding: 1px 5px; border-radius: 2px; white-space: nowrap; }
button.wid { position: relative; border: 0; cursor: pointer; padding: 3px 7px; }
@media (pointer: coarse) { button.wid::after { content: ""; position: absolute; inset: -12px -4px; } }
.cut-chk { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; cursor: pointer; }
.cut-cell { width: 44px; text-align: center; }
.cut-cell label { display: inline-grid; place-items: center; width: 44px; height: 44px; margin: -11px -6px; cursor: pointer; }
.c-path, .c-det, .c-act, .cut-tbl .c-meta, .m-only { display: none; }

/* Tableaux compacts quand la place manque (requête de conteneur) */
.cq { container-type: inline-size; min-width: 0; }
@container (max-width: 640px) {
  .tbl-wrap.cards-m { border: 0; background: none; overflow: visible; border-radius: 0; }
  .cards-m .tbl, .cards-m .tbl tbody { display: block; }
  .cards-m .tbl thead { display: none; }
  .cards-m .tbl tr { display: grid; gap: 2px 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
  .cards-m .tbl td { display: block; padding: 0; border: 0; min-width: 0; }
  .cards-m .tbl tr.group { display: block; background: none; border: 0; padding: 14px 2px 4px; margin: 0; }
  .cards-m .tbl tr.group td { background: none; padding: 0; }
  .m-only { display: inline; }
  .cut-tbl tr { grid-template-columns: 44px auto minmax(0, 1fr) auto; grid-template-areas: "chk id color len" "chk path path path"; align-items: center; }
  .cut-tbl tr.open { grid-template-areas: "chk id color len" "chk path path path" "chk det det det" "chk act act act"; }
  .cut-tbl .c-chk { grid-area: chk; align-self: start; }
  .cut-tbl .c-chk label { margin: -6px -6px; }
  .cut-tbl .c-id { grid-area: id; }
  .cut-tbl .c-color { grid-area: color; overflow: hidden; }
  .cut-tbl .c-len { grid-area: len; font: 600 15px var(--font-mono); }
  .cut-tbl .c-len::after { content: " m"; font-size: 12px; color: var(--muted); }
  .cut-tbl .c-path { grid-area: path; display: block; font: 500 13px/1.35 var(--font-mono); overflow-wrap: anywhere; }
  .cut-tbl .c-mm2, .cut-tbl .c-from, .cut-tbl .c-to, .cut-tbl .c-cable, .cut-tbl .c-harn, .cut-tbl .c-note { display: none !important; }
  .cut-tbl tr:not(.open) .c-det, .cut-tbl tr:not(.open) .c-act { display: none; }
  .cut-tbl tr.open .c-det { grid-area: det; display: grid; gap: 2px; font-size: 13px; color: var(--ink-2); padding-top: 4px; }
  .cut-tbl tr.open .c-act { grid-area: act; display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 2px; }
  .pin-tbl tr { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "pin fn" "wire wire" "dest dest"; }
  .pin-tbl td:nth-child(1) { grid-area: pin; font-weight: 600; }
  .pin-tbl td:nth-child(2) { grid-area: fn; }
  .pin-tbl td.p-wire { grid-area: wire; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .pin-tbl td.p-dest { grid-area: dest; }
  .pin-tbl td.p-free { grid-area: wire; }
}

/* ---------- Outils ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
.toolbar.sticky { position: sticky; top: var(--sticky-top); z-index: 30; background: var(--paper); padding: 10px 0; margin-bottom: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .btn { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 4px; padding: 7px 11px; font-size: 13.5px; cursor: pointer; white-space: nowrap; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:hover, .seg button:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn .n { font: 600 11px var(--font-mono); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 1px 6px; }
input[type="search"], select { font-size: 16px; color: var(--ink); background: var(--sheet); border: 1px solid var(--muted); border-radius: 4px; padding: 8px 10px; min-width: 0; min-height: 44px; }
input[type="search"] { width: min(100%, 300px); }
.count { font: 500 12.5px var(--font-mono); color: var(--muted); }
.progress { display: inline-flex; align-items: center; gap: 8px; font: 500 12.5px var(--font-mono); color: var(--ink-2); }
.progress i { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: var(--sheet-2); border: 1px solid var(--rule); overflow: hidden; position: relative; }
.progress i b { position: absolute; inset: 0 auto 0 0; background: var(--good); }
.segsw > button { flex: 1 1 0; min-width: 0; }
.segsw { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
.segsw button { min-height: 44px; border: 0; background: var(--sheet); font: 600 15px/1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.segsw button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
@media (max-width: 760px), (max-height: 520px) and (pointer: coarse) {
  .toolbar.sticky { margin-inline: -16px; padding: 8px 16px; border-bottom: 1px solid var(--rule); flex-wrap: nowrap; }
  .toolbar.sticky input[type="search"], .toolbar.sticky .srch { flex: 1 1 auto; width: auto; }
}

/* ---------- Recherche globale ---------- */
.srch { position: relative; min-width: 0; }
.srch input { width: 100%; padding-left: 36px; }
.srch > svg.ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.srch-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 80; margin: 0; padding: 4px; list-style: none; background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 6px; box-shadow: 0 10px 28px var(--shadow); max-height: min(60vh, 440px); overflow: auto; min-width: min(92vw, 360px); overscroll-behavior: contain; }
.srch-list li.opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 8px 8px 10px; border-radius: 4px; cursor: pointer; min-height: 48px; }
.srch-list li.opt[aria-selected="true"], .srch-list li.opt:hover { background: var(--sheet-2); }
.srch-list .k { font: 600 9.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--rule-strong); border-radius: 3px; padding: 2px 4px; grid-row: span 2; }
.srch-list .t { font: 600 13.5px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srch-list .s { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; grid-column: 2; }
.srch-list .acts { grid-row: span 2; grid-column: 3; display: flex; gap: 4px; align-items: center; }
@media (pointer: coarse) { .vw-dquick .btn, .srch-list .acts button { min-height: 44px !important; } }
.srch-list .acts button { min-height: 36px; padding: 4px 8px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--sheet); font: 500 11.5px var(--font-mono); cursor: pointer; }
.srch-list .acts button:hover { border-color: var(--ink); }
.srch-list .empty { color: var(--muted); font-size: 13px; padding: 10px; }

/* ---------- Brochage ECU ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid var(--rule-strong); }
.ecu-layout { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); align-items: start; }
.cmc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.cmc { display: grid; grid-template-columns: 22px repeat(4, minmax(0, 1fr)); gap: 4px; }
.cmc .lab { font: 600 12px var(--font-mono); color: var(--muted); display: grid; place-items: center; }
.pin { --fam: var(--fam-ref); min-height: 56px; min-width: 0; border: 1px solid var(--rule); border-left: 4px solid var(--fam); background: color-mix(in srgb, var(--fam) 13%, var(--sheet)); border-radius: 3px; padding: 5px 6px; text-align: left; cursor: pointer; display: grid; align-content: start; gap: 1px; }
.pin .pid { font: 600 13px/1.1 var(--font-mono); }
.pin .pfn { font-size: 11px; line-height: 1.2; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: break-word; hyphens: auto; }
.pin.free { --fam: var(--rule-strong); background: repeating-linear-gradient(135deg, transparent 0 6px, var(--rule) 6px 7px), var(--sheet); }
.pin.free .pid, .pin.free .pfn { color: var(--muted); }
.pin[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }
.pin:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }
.detail { border: 1.5px solid var(--ink); background: var(--sheet); border-radius: 6px; padding: 14px 16px; }
.detail h3 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 8px 0 0; font-size: 14px; }
.kv dt { color: var(--muted); font: 600 11px/1.9 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.wire-line { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--rule); }
.wire-line:first-of-type { border-top: 0; }

/* Panneau non bloquant (détail de broche, téléphone) */
.dock { position: fixed; left: 0; right: 0; bottom: var(--bnav-h); z-index: 45; background: var(--sheet); border-top: 1.5px solid var(--ink); border-radius: 14px 14px 0 0; box-shadow: 0 -10px 30px var(--shadow); max-height: 52vh; max-height: 52dvh; overflow: auto; overscroll-behavior: contain; padding: 0 16px 14px; }
.dock[hidden] { display: none; }
.dock-head { position: sticky; top: 0; display: flex; align-items: center; gap: 10px; background: var(--sheet); padding: 10px 0 8px; z-index: 1; }
.dock-head h3 { flex: 1; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; min-width: 0; }

/* ---------- Visualiseur (planches, formboard) ---------- */
.viewer { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; scroll-margin-top: calc(var(--sticky-top) + 6px); }
.vw-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vw-bar .grow { flex: 1 1 220px; min-width: 0; }
.vw-nav { display: flex; gap: 6px; align-items: center; min-width: 0; flex: 1 1 300px; }
.vw-nav select { flex: 1; width: 0; min-width: 0; font-weight: 600; }
.vw-body { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.vw-stage { position: relative; height: clamp(340px, calc(100vh - 230px), 860px); height: var(--stage-h, clamp(340px, calc(100svh - 230px), 860px)); border: 1.5px solid var(--ink); border-radius: 4px; background: var(--sheet); overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: contain; }
.vw-stage:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.vw-stage.is-panning { cursor: grabbing; }
.vw-stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vw-hud { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; z-index: 3; }
.vw-btn { min-width: 44px; height: 44px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--sheet); box-shadow: 0 1px 4px var(--shadow); font: 600 17px/1 var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.vw-btn:hover { border-color: var(--ink); }
.vw-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.vw-btn.txt { font-size: 13.5px; font-weight: 600; }
.vw-pct { font: 500 12.5px var(--font-mono); min-width: 62px; }
.vw-mini { position: absolute; left: 10px; bottom: 10px; z-index: 3; background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 6px; box-shadow: 0 1px 4px var(--shadow); touch-action: none; cursor: crosshair; overflow: hidden; }
.vw-mini svg { display: block; width: 100%; height: 100%; }
.vw-mini-view { fill: color-mix(in srgb, var(--accent) 18%, transparent); stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
.vw-flash { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 4; background: var(--ink); color: var(--paper); padding: 8px 12px; border-radius: 6px; font-size: 13px; pointer-events: none; opacity: 0; max-width: calc(100% - 28px); text-align: center; }
.vw-flash.on { opacity: .94; }
.vw-scale { position: absolute; left: 10px; top: 10px; z-index: 3; display: grid; gap: 3px; pointer-events: none; font: 600 11px var(--font-mono); color: var(--ink); background: color-mix(in srgb, var(--sheet) 88%, transparent); padding: 4px 6px; border-radius: 4px; }
.vw-scale i { display: block; height: 7px; border: 2px solid var(--ink); border-top: 0; }
.vw-hint { font-size: 12.5px; color: var(--muted); margin: 0; }
@media (pointer: coarse) { .kbd-hint { display: none; } }
.vw-close { display: none; }
html.vw-lock, html.vw-lock body { overflow: hidden; }
.viewer.is-full { position: fixed; inset: 0; z-index: 60; background: var(--paper); padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 8px) calc(env(safe-area-inset-left, 0px) + 10px); grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
.viewer.is-full .vw-hint, .viewer.is-full .inline-only { display: none; }
.viewer.is-full .vw-body { min-height: 0; height: 100%; }
.viewer.is-full .vw-stage { height: 100%; touch-action: none; }
.vw-stage.pan-all { touch-action: none; }
.viewer.is-full .vw-close { display: inline-flex; order: -1; }
@media (max-width: 760px), (max-height: 520px) and (pointer: coarse) {
  .vw-pct { display: none; }
  .vw-mini { left: 10px; top: 10px; bottom: auto; }
  .viewer:not(.is-full) .vw-mini { display: none; }
  .vw-scale { left: auto; right: 10px; }
  .vw-bar .srch { flex: 1 1 160px; }
  .viewer.is-full .vw-nav { flex-basis: 200px; }
  .viewer.is-full .vw-bar .srch { flex: 1 1 160px; }
}
@media (prefers-reduced-motion: no-preference) { .vw-flash { transition: opacity .2s; } }

/* Panneau de détail du visualiseur */
.vw-drawer { background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 6px; min-width: 0; }
.vw-drawer[hidden] { display: none !important; }
.vw-dhead { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px 14px; }
.vw-dhead .sum { flex: 1; min-width: 0; display: grid; gap: 2px; text-align: left; background: none; border: 0; padding: 2px 0; cursor: pointer; min-height: 44px; align-content: center; }
.vw-dhead .sum strong { font: 600 14px var(--font-body); overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.vw-dhead .sum small { color: var(--ink-2); font: 500 12.5px var(--font-mono); overflow-wrap: anywhere; }
.vw-dquick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px 14px; border-bottom: 1px solid var(--rule); }
.vw-dquick:empty { display: none; }
.vw-dquick .btn { min-height: 40px; font-size: 13px; }
.vw-dbody { padding: 12px 14px 14px; }
.vw-dbody .tbl { font-size: 13px; }
.vw-dact { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.vw-grab { display: none; }
@media (min-width: 900px) {
  .viewer.is-full .vw-body.has-drawer { grid-template-columns: minmax(0, 1fr) 380px; }
  .viewer.is-full .vw-drawer { overflow: auto; max-height: 100%; }
}
@media (max-width: 899px) {
  .vw-drawer { position: fixed; left: 0; right: 0; bottom: var(--bnav-h); z-index: 45; border-radius: 14px 14px 0 0; border-width: 1.5px 0 0; box-shadow: 0 -10px 30px var(--shadow); max-height: 62vh; max-height: 62dvh; overflow: auto; overscroll-behavior: contain; }
  .viewer.is-full .vw-drawer { bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 62; }
  .vw-grab { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--rule-strong); margin: 7px auto 0; }
  .vw-drawer.peek .vw-dbody { display: none; }
  .vw-dhead { position: sticky; top: 0; background: var(--sheet); z-index: 1; }
}

/* Dessins */
svg.schem text, svg.formboard text { fill: var(--ink); font-family: var(--font-body); }
.schem .box-bg { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.2; }
.schem .box-head { fill: var(--sheet-2); }
.schem .box-sep { stroke: var(--rule-strong); stroke-width: 1; }
.schem .t-id { font: 600 12px var(--font-mono); }
.schem .t-label { font-size: 11.5px; font-weight: 600; }
.schem .t-ref, .schem .t-fn { font-size: 10.5px; fill: var(--ink-2); }
.schem .t-pin { font: 600 11px var(--font-mono); }
.schem .xg rect { fill: color-mix(in srgb, var(--accent) 12%, var(--sheet)); stroke: var(--accent); stroke-width: 1; }
.schem .xg text { font: 600 10px var(--font-mono); fill: var(--accent); }
.schem .xg { cursor: pointer; }
.schem .t-big { font: 700 30px var(--font-mono); fill: var(--ink); display: none; paint-order: stroke; stroke: var(--sheet); stroke-width: 6px; stroke-linejoin: round; pointer-events: none; }
.schem .node text, .schem .xref { paint-order: stroke; stroke: var(--sheet); stroke-width: 3.5px; stroke-linejoin: round; }
.schem .port-dot { fill: var(--ink); }
.schem .node-dot { fill: var(--ink); }
.schem .node-ring { fill: none; stroke: var(--muted); stroke-dasharray: 3 2; }
.schem .gnd line { stroke: var(--ink); stroke-width: 1.6; }
.schem .w-halo { fill: none; stroke: var(--sheet); stroke-linecap: round; }
.schem .w-edge { fill: none; stroke: var(--wire-edge); stroke-linecap: round; }
.schem .w-core, .schem .w-stripe { fill: none; stroke-linecap: butt; }
.schem .w-hit { fill: none; stroke: transparent; stroke-width: 22px; vector-effect: non-scaling-stroke; cursor: pointer; }
.schem .w-bus { fill: none; stroke: var(--muted); stroke-width: 4; stroke-dasharray: 2 4; stroke-linecap: round; }
.schem .w-drain { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 5 3; }
.schem .tag rect.tg { fill: var(--tag); stroke: var(--tag-ink); stroke-opacity: .35; }
.schem .tag text { font: 500 10px var(--font-mono); fill: var(--tag-ink); }
.schem .tag.done text { fill: var(--ink-2); }
.schem .tag.done rect.tg { fill: var(--rule); }
.schem .tag.pick rect.tg { stroke: var(--accent); stroke-width: 2.5; stroke-opacity: 1; }
.schem .box, .schem .node, .schem .tag { cursor: pointer; }
.schem.dim .wire:not(.hl), .schem.dim .tag:not(.hl) { opacity: .1; }
.schem.dim .box:not(.hl), .schem.dim .node:not(.hl) { opacity: .4; }
.schem .wire.hl .w-edge { stroke: var(--accent); }
.schem .wire.pick .w-halo { stroke: var(--accent); stroke-opacity: .4; }
.schem.lod-2 .t-ref, .schem.lod-2 .tag-dup:not(.hl) { display: none; }
.schem.lod-1 .tag, .schem.lod-1 .t-fn, .schem.lod-1 .t-ref, .schem.lod-1 .t-pin, .schem.lod-1 .t-label, .schem.lod-1 .t-id, .schem.lod-1 .xref, .schem.lod-1 .xg { display: none; }
.schem.lod-1.dim .tag.hl { display: inline; }
.schem.lod-1 .t-big { display: inline; }
.no-tags .schem .tag:not(.hl) { display: none; }
.formboard .seg-hit { fill: none; stroke: transparent; stroke-width: 22px; vector-effect: non-scaling-stroke; cursor: pointer; }
.formboard .node-hit { fill: transparent; cursor: pointer; }
.formboard .seg.hl path.seg-ink { stroke: var(--accent); }
.formboard.lod-1 .fb-small { display: none; }

/* ---------- Feuille du bas (dialog) ---------- */
dialog.bs { margin: auto auto 0; width: 100%; max-width: 100%; max-height: 86vh; max-height: 86dvh; border: 0; border-top: 1.5px solid var(--ink); border-radius: 14px 14px 0 0; padding: 0 16px calc(max(env(safe-area-inset-bottom, 0px), 8px) + 12px); background: var(--sheet); color: var(--ink); box-shadow: 0 -10px 30px var(--shadow); overflow: auto; overscroll-behavior: contain; }
dialog.bs::backdrop { background: var(--scrim); }
.bs-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--sheet); padding: 12px 0 10px; }
.bs-head h3 { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.bs-grab { width: 40px; height: 5px; border-radius: 3px; background: var(--rule-strong); margin: 8px auto 0; }
.icon-btn { width: 44px; height: 44px; flex: none; display: inline-grid; place-items: center; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--sheet); cursor: pointer; }
.icon-btn:hover { border-color: var(--ink); }
@media (min-width: 761px) {
  dialog.bs { margin: auto; width: min(560px, 92vw); border: 1.5px solid var(--ink); border-radius: 10px; max-height: 84vh; }
}
.more-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.more-grid button { display: grid; gap: 6px; justify-items: start; padding: 12px 14px; min-height: 80px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet-2); cursor: pointer; text-align: left; }
.more-grid button[aria-current="page"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.more-grid button strong { font: 600 16px/1.1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; }
.more-grid button small { color: var(--muted); font-size: 12px; line-height: 1.3; }
.more-grid svg.ic { color: var(--accent); }
.filters { display: grid; gap: 10px; }
.filters label { display: grid; gap: 4px; font: 600 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.filters select { width: 100%; }

/* Retour après un lien croisé */
.backchip { position: fixed; z-index: 55; left: 50%; transform: translateX(-50%); top: calc(var(--sticky-top) + 10px); display: inline-flex; align-items: center; border-radius: 24px; background: var(--ink); color: var(--paper); box-shadow: 0 6px 18px var(--shadow); max-width: calc(100vw - 32px); }
.backchip[hidden] { display: none; }
.linkish { font: inherit; color: inherit; background: none; border: 0; padding: 6px 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; min-height: 32px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.store-warn { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 0 0 14px; padding: 10px 12px; border: 1px solid var(--warn-ink); border-radius: 6px; background: var(--sheet); font-size: 13.5px; color: var(--ink-2); }
.backchip button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 0; background: none; color: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; min-width: 0; }
.backchip .bk-go { padding-left: 10px; max-width: calc(100vw - 100px); }
.backchip .bk-go span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.backchip .bk-x { border-left: 1px solid color-mix(in srgb, var(--paper) 30%, transparent); width: 44px; justify-content: center; padding: 0; }
.backchip .bk-n { font: 600 11px/1 var(--font-mono); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 2px 5px; }
/* Téléphone : en haut à gauche, jamais sur le tiroir de détail, le HUD ou la barre du bas ; la recherche reste libre */
@media (max-width: 760px), (max-height: 520px) and (pointer: coarse) {
  .backchip { top: calc(var(--sticky-top) + 8px); left: max(12px, env(safe-area-inset-left, 0px)); transform: none; max-width: calc(100vw - 88px); }
  .backchip .bk-go { max-width: calc(100vw - 140px); }
  html.has-back .toolbar.sticky { padding-top: 60px; }
}

/* ---------- Jauges énergie ---------- */
.meters { display: grid; gap: 0; }
.meter-row { display: grid; grid-template-columns: 54px minmax(0, 1.2fr) minmax(90px, 1fr) 160px 104px; gap: 12px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--rule); }
details.meter-d { border-bottom: 1px solid var(--rule); }
details.meter-d:last-child { border-bottom: 0; }
details.meter-d > summary { list-style: none; cursor: pointer; border-bottom: 0; min-height: 52px; }
details.meter-d > summary::-webkit-details-marker { display: none; }
details.meter-d > ul { margin: 0 0 10px 66px; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
details.meter-d > ul li { font: 500 12px var(--font-mono); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 7px; background: var(--sheet-2); }
.meters > .meter-row:last-child { border-bottom: 0; }
.meter-row .id { font: 600 13px var(--font-mono); }
.meter-row .lbl { min-width: 0; font-size: 13.5px; }
.meter-row .lbl small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.meter { position: relative; height: 10px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--good); }
.meter .fill.warn { background: var(--warn); }
.meter .fill.bad { background: var(--bad); }
.meter .range { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--warn) 0 3px, transparent 3px 6px); }
.meter-row .val { font: 500 12.5px var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter-row .st { justify-self: start; }
@media (max-width: 700px) {
  .meter-row { grid-template-columns: 46px minmax(0, 1fr) auto; }
  .meter-row .meter { grid-column: 1 / -1; grid-row: 2; }
  .meter-row .val { grid-column: 2; grid-row: 3; text-align: left; }
  .meter-row .st { grid-column: 3; grid-row: 1; }
  details.meter-d > ul { margin-left: 4px; }
}

/* ---------- Connecteurs ---------- */
.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); align-items: start; }
.card { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; min-width: 0; scroll-margin-top: calc(var(--sticky-top) + 74px); }
.card[hidden] { display: none; }
.card > summary { list-style: none; cursor: pointer; }
.card > summary::-webkit-details-marker { display: none; }

      const pmin = Math.min(100, o.a_min / o.max_a * 100), pmax = Math.min(100, o.a_max / o.max_a * 100);
      return h("div", { class: "meter-row" },
        h("span", { class: "id" }, o.pin.split(".")[1]),
        h("span", { class: "lbl" }, o.fn, h("small", null, o.pin + " → " + o.loads.join(", "))),
        h("div", { class: "meter", role: "img", "aria-label": o.pin + " : " + dec(o.a_min) + " à " + dec(o.a_max) + " A sur " + o.max_a + " A" },
          h("span", { class: "fill " + (o.status === "ok" ? "" : o.status === "bad" ? "bad" : ""), style: "width:" + pmin + "%" }),
          pmax > pmin ? h("span", { class: "range", style: "left:" + pmin + "%;width:" + (pmax - pmin) + "%" }) : null),
        h("span", { class: "val" }, (o.a_min === o.a_max ? dec(o.a_max) : dec(o.a_min) + "–" + dec(o.a_max)) + " / " + o.max_a + " A"),
        st(o.status));
    });
    const relays = Object.keys(OW).filter(o => OW[o].cat === "relay");
    sec.append(h("h2", null, "Énergie : fusibles, relais, sorties"),
      h("p", { class: "lede" }, "Charges estimées en régime établi (consommations indiquées dans la définition). Une jauge au-delà de 80 % passe en alerte. Touche un fusible pour la liste de ses consommateurs."),
      h("div", { class: "stack" },
        h("div", { class: "panel" }, h("h3", null, "Fusibles"), h("div", { class: "meters" }, fuseRows)),
        h("div", { class: "panel" }, h("h3", null, "Sorties ECU sous charge"),
          h("p", { class: "muted", style: "margin:-2px 0 8px;font-size:13px" }, "Partie hachurée : plage d'incertitude tant que la résistance réelle n'est pas mesurée."),
          h("div", { class: "meters" }, outRows)),
        H.drops.length ? h("div", { class: "panel" }, h("h3", null, "Chutes de tension des charges fortes"),
          h("p", { class: "muted", style: "margin:-2px 0 8px;font-size:13px" }, "Aller + retour sur les fils du faisceau, cuivre à 50 °C, rapportée à 13,5 V. Au-delà de 3 % : augmenter la section."),
          h("div", { class: "tbl-wrap", style: "border:0" }, h("table", { class: "tbl" },
            h("thead", null, h("tr", null, ["Charge", "Courant", "Fils", "Résistance", "Chute", ""].map(t => h("th", null, t)))),
            h("tbody", null, H.drops.map(d => h("tr", null, h("td", null, h("span", { class: "mono" }, d.id), " ", d.label),
              h("td", { class: "num" }, dec(d.a, 1) + " A"), h("td", { class: "mono fn" }, d.wires.join(" ")),
              h("td", { class: "num" }, dec(d.r_mohm, 1) + " mΩ"), h("td", { class: "num" }, dec(d.drop_v) + " V · " + dec(d.pct, 1) + " %"),
              h("td", null, d.status === "ok" ? h("span", { class: "chip good" }, "✓ OK") : h("span", { class: "chip warn" }, "! section")))))))) : null,
        h("div", { class: "cols-2" },
          h("div", { class: "panel" }, h("h3", null, "Alimentation capteurs +5 V"),
            h("p", { style: "margin:0" }, "Consommation estimée sur CMC1 G1 : ", h("strong", { class: "mono" }, H.five_v_ma + " mA"), " (pressions huile/essence, papillon, pédale). Une seule alimentation 5 V sur la RACE Gen1 : pédale et papillon la partagent.")),
          h("div", { class: "panel" }, h("h3", null, "Relais"),
            h("div", { class: "tbl-wrap", style: "border:0" }, h("table", { class: "tbl" },
              h("thead", null, h("tr", null, ["Relais", "Fonction", "Calibre", "Bobine"].map(t => h("th", null, t)))),
              h("tbody", null, relays.map(r => h("tr", null, h("td", { class: "mono" }, r), h("td", null, OW[r].label), h("td", { class: "num" }, OW[r].rating_a + " A"),
                h("td", { class: "fn" }, (wiresAt[r + ".86"] || []).map(w => otherEnd(w, r + ".86")).join(", ") + " / " + (wiresAt[r + ".85"] || []).map(w => otherEnd(w, r + ".85")).join(", "))))))))))
    );
  };

  // --------------------------------------------------------------- formboard
  RENDER.formboard = function (sec) {
    const T = H.topology;
    const kids = {}, segOf = {};
    const adj = {};
    T.segments.forEach(s => { (adj[s.a] = adj[s.a] || []).push([s.b, s]); (adj[s.b] = adj[s.b] || []).push([s.a, s]); });
    const dist = {}, parent = {};
    dist[T.root] = 0;
    const order = [T.root];
    for (let i = 0; i < order.length; i++) {
      const n = order[i];
      (adj[n] || []).forEach(([m, s]) => { if (dist[m] == null) { dist[m] = dist[n] + s.length; parent[m] = n; segOf[m] = s; (kids[n] = kids[n] || []).push(m); order.push(m); } });
    }
    const at = {}; Object.keys(OW).forEach(o => { if (OW[o].node) (at[OW[o].node] = at[OW[o].node] || []).push(o); });
    const SCALE = 300, X0 = 40, RH = 34;
    let leafRow = 0; const Y = {};
    (function place(n) {
      const k = kids[n] || [];
      if (!k.length) { Y[n] = 40 + leafRow++ * RH; return; }
      k.forEach(place);
      Y[n] = (Y[k[0]] + Y[k[k.length - 1]]) / 2;
    })(T.root);
    const X = n => X0 + dist[n] * SCALE;
    const maxX = Math.max(...Object.keys(dist).map(X));
    const W = maxX + 330, Hh = 40 + leafRow * RH + 90;
    const svg = sv("svg", { class: "formboard", viewBox: "0 0 " + W + " " + Hh, role: "img", "aria-label": "Formboard du faisceau à l'échelle" });
    const gL = sv("g"), gN = sv("g"), gT = sv("g");
    const miniG = sv("g");
    const segBox = {};
    order.slice(1).forEach(n => {
      const p = parent[n], s = segOf[n];
      const w = s.bundle_mm ? 1.5 + s.bundle_mm * 0.32 : 1;
      const d = "M" + X(p) + "," + Y[p] + " V" + Y[n] + " H" + X(n);
      segBox[s.id] = { x: Math.min(X(p), X(n)) - 30, y: Math.min(Y[p], Y[n]) - 30, w: Math.abs(X(n) - X(p)) + 60, h: Math.abs(Y[n] - Y[p]) + 60 };
      const g = sv("g", { class: "seg", "data-seg": s.id });
      g.append(sv("path", { d: d, fill: "none", stroke: "var(--sheet)", "stroke-width": w + 4 }));
      g.append(sv("path", { class: "seg-ink", d: d, fill: "none", stroke: "var(--ink)", "stroke-width": w, "stroke-linejoin": "round" }));
      g.append(sv("path", { class: "seg-hit", d: d }));
      g.append(sv("title", null, s.a + " → " + s.b + " · " + dec(s.length) + " m · " + s.wires + " fils · Ø " + dec(s.bundle_mm, 1) + " mm" + (s.sleeve ? " · " + s.sleeve : "")));
      gL.append(g);
      miniG.append(sv("path", { d: d, fill: "none", stroke: "currentColor", "stroke-width": 8 }));
      const span = X(n) - X(p);
      if (span >= 34) gT.append(sv("text", { class: "fb-small", x: (X(p) + X(n)) / 2, y: Y[n] - w / 2 - 4, "text-anchor": "middle", style: "font:500 10px var(--font-mono);fill:var(--ink-2)" },
        Math.round(s.length * 1000) + (span >= 90 && s.bundle_mm ? " · Ø" + dec(s.bundle_mm, 0) : "")));
    });
    order.forEach(n => {
      const leaf = !(kids[n] || []).length;
      const ng = sv("g", { class: "fnode", "data-node": n });
      ng.append(sv("circle", { class: "node-hit", cx: X(n), cy: Y[n], r: 14 }));
      ng.append(sv("circle", { cx: X(n), cy: Y[n], r: leaf ? 4 : 3, fill: "var(--ink)" }));
      gN.append(ng);
      const owners = (at[n] || []).filter(o => !OW[o].cable);
      if (leaf) {
        const t = sv("text", { x: X(n) + 9, y: Y[n] + 4, style: "font-size:12px" });
        t.append(sv("tspan", { style: "font-weight:600" }, T.nodes[n]));
        if (owners.length) t.append(sv("tspan", { class: "fb-small", style: "font:500 10.5px var(--font-mono);fill:var(--ink-2)" }, "  " + owners.join(" ")));
        gT.append(t);
      } else if (owners.length || n === T.root) {
        const lx = X(n) + 3, ly = Y[n] + 11;
        gT.append(sv("text", { class: "fb-small", x: lx, y: ly, transform: "rotate(38 " + lx + " " + ly + ")", style: "font:500 9.5px var(--font-mono);fill:var(--accent);paint-order:stroke;stroke:var(--sheet);stroke-width:3px" }, trunc(owners.join(" "), 30)));
      }
    });
    svg.append(gL, gN, gT);
    miniG.setAttribute("style", "color:var(--ink)");
    const scale = h("div", { class: "vw-scale", "aria-hidden": "true" }, h("span"), h("i"));
    const NICE = [10, 20, 50, 100, 200, 500, 1000, 2000];
    const vw = createViewer({
      label: "Formboard à l'échelle", lod: 0.45,
      hint: "Glisser pour déplacer · pincer, Ctrl + molette ou double-toucher pour zoomer · touche un tronçon ou un nœud pour le détail",
      onTap: ev => {
        const g = ev.target.closest(".seg");
        if (g) { selectSeg(g.dataset.seg, false); return; }
        const nd = ev.target.closest(".fnode");
        if (nd) { selectNode(nd.dataset.node); return; }
        clear();
      },
      onEscape: () => { if (!vw.drawer.hidden) { clear(); return true; } return false; },
      onView: v => {
        const pxPerMm = SCALE / 1000 * v.k;
        const mm = NICE.find(m => m * pxPerMm >= 60) || NICE[NICE.length - 1];
        scale.firstChild.textContent = mm >= 1000 ? (mm / 1000) + " m" : mm + " mm";
        scale.lastChild.style.width = Math.round(mm * pxPerMm) + "px";
      },
    });
    vw.stage.append(scale);
    function clear() { svg.querySelectorAll(".seg.hl").forEach(x => x.classList.remove("hl")); vw.setDrawer(false); }
    function selectSeg(id, focus) {
      const s = T.segments.find(x => x.id === id); if (!s) return;
      svg.querySelectorAll(".seg").forEach(x => x.classList.toggle("hl", x.dataset.seg === id));
      const ws = REAL.filter(w => (w.path || []).includes(id));
      const cabs = H.cables.filter(c => (c.path || []).includes(id));
      drawerContent(vw, [h("span", { class: "mono" }, s.a + " → " + s.b), " · " + Math.round(s.length * 1000) + " mm"],
        s.wires + " fils · Ø " + dec(s.bundle_mm, 1) + " mm" + (s.sleeve ? " · " + s.sleeve : ""), [],
        [h("p", { class: "muted", style: "margin:0 0 8px;font-size:13px" }, "Fils qui passent dans ce tronçon" + (cabs.length ? " (dont câbles " + cabs.map(c => c.id).join(", ") + ")" : "") + " :"),
          h("div", { style: "display:flex;flex-wrap:wrap;gap:8px" }, ws.map(w => wireTag(w, () => { vw.setFull(false); goSheet(w.sheet, { wire: w.id }, "formboard"); })))],
        clear);
      if (focus) vw.focusBox(segBox[id], 1.6);
    }
    function selectNode(n) {
      svg.querySelectorAll(".seg").forEach(x => x.classList.toggle("hl", x.dataset.seg.split("~").includes(n)));
      const owners = (at[n] || []).filter(o => !OW[o].cable);
      drawerContent(vw, [h("span", { class: "mono" }, n), " · " + T.nodes[n]], dec(dist[n], 2) + " m depuis l'ECU · " + owners.length + " élément(s)", [],
        [h("div", { style: "display:flex;flex-wrap:wrap;gap:8px" }, owners.map(o => h("button", { class: "btn", onclick: () => { vw.setFull(false); if (isFiche(o)) openFiche(o, "formboard"); else if (bestSheet(o)) goSheet(bestSheet(o), { owner: o }, "formboard"); } },
          h("span", { class: "mono" }, o), " ", OW[o].cat === "ecu" ? "" : trunc(OW[o].label, 28))))], clear);
    }
    vw.bar.append(vw.closeBtn, h("span", { class: "count grow" }, "Échelle 1 m = " + SCALE + " unités · " + T.segments.length + " tronçons · touche un tronçon pour ses fils"));
    const segRows = order.slice(1).map(n => segOf[n]).map(s => h("tr", { class: "clickable", onclick: () => { scrollToEl(vw.root, 6); selectSeg(s.id, true); } },
      h("td", { class: "mono" }, h("button", { type: "button", class: "linkish", onclick: ev => { ev.stopPropagation(); scrollToEl(vw.root, 6); selectSeg(s.id, true); } }, s.a + " → " + s.b)),
      h("td", null, T.nodes[s.b]), h("td", { class: "num" }, Math.round(s.length * 1000) + " mm"), h("td", { class: "num" }, s.wires),
      h("td", { class: "num" }, s.bundle_mm ? dec(s.bundle_mm, 1) + " mm" : "—"), h("td", { class: "mono fn" }, s.sleeve || "—")));
    sec.append(h("h2", null, "Formboard"),
      h("p", { class: "lede" }, (T.estimated ? "Longueurs ESTIMÉES : mesure chaque tronçon sur la voiture (ficelle le long du trajet réel), reporte les valeurs dans la section topology du YAML et régénère : toutes les longueurs de coupe suivent. " : "") +
        "Tracé à l'échelle ; l'épaisseur des traits suit le diamètre estimé du toron."),
      vw.root,
      h("h3", { style: "margin-top:24px" }, "Tronçons, torons et gaine"),
      h("div", { class: "tbl-wrap" }, h("table", { class: "tbl" },
        h("thead", null, h("tr", null, ["Tronçon", "Vers", "Longueur", "Fils", "Ø toron", "Gaine conseillée"].map(t => h("th", null, t)))),
        h("tbody", null, segRows))));
    vw.setContent(svg, W, Hh, miniG, null);
  };

  // ---------------------------------------------------------------- contrôles
  RENDER.controles = function (sec) {
    const blocks = H.checks.map((ph, pi) => {
      const counter = h("span", { class: "count" });
      const upd = () => { const n = ph.items.filter((_, ii) => CHECKS[pi + "-" + ii]).length; counter.textContent = n + " / " + ph.items.length; };
      const list = h("ol", null, ph.items.map((it, ii) => {
        const id = "chk-" + pi + "-" + ii;
        const box = h("input", { type: "checkbox", id: id, checked: !!CHECKS[pi + "-" + ii] });
        box.addEventListener("change", () => { if (box.checked) CHECKS[pi + "-" + ii] = true; else delete CHECKS[pi + "-" + ii]; store("checks", CHECKS); upd(); updateBadge(); });
        return h("li", null, h("label", { for: id }, box, h("span", null, it)));
      }));
      upd();
      return h("div", { class: "phase" }, h("header", null, h("h3", null, ph.phase), counter), list);
    });
    let armed = false;
    const reset = h("button", { class: "btn" }, "Tout décocher");
    reset.addEventListener("click", () => {
      if (!armed) { armed = true; reset.textContent = "Confirmer la remise à zéro"; setTimeout(() => { armed = false; reset.textContent = "Tout décocher"; }, 4000); return; }
      Object.keys(CHECKS).forEach(k => delete CHECKS[k]); store("checks", CHECKS); updateBadge();
      sec.replaceChildren(); RENDER.controles(sec);
    });
    sec.append(h("h2", null, "Contrôles"),
      h("p", { class: "lede" }, "Trois passes : au banc avant de sertir, faisceau terminé avant de brancher l'ECU, puis première mise sous tension." + (STORE_OK ? " Les cases restent cochées sur cet appareil." : "")), storeWarn(),
      h("div", { class: "stack" }, blocks, h("div", null, reset)),
      h("h3", { style: "margin-top:28px" }, "Réglages MTune liés au câblage"),
      h("div", { class: "tbl-wrap" }, h("table", { class: "tbl" },
        h("thead", null, h("tr", null, h("th", null, "Fonction"), h("th", null, "Réglage"))),
        h("tbody", null, H.mtune.map(t => h("tr", null, h("td", null, h("strong", null, t.item)), h("td", null, t.value)))))));
  };

  // ------------------------------------------------------------- nomenclature
  RENDER.nomenclature = function (sec) {
    const cats = [...new Set(H.bom.map(r => r.cat))];
    sec.append(h("h2", null, "Nomenclature"),
      h("p", { class: "lede" }, "Quantités calculées depuis le faisceau : contacts réellement utilisés, mètres de fil par section et couleur (+10 % de marge), gaine par tronçon du formboard, deux étiquettes par fil."),
      h("div", { class: "tbl-wrap" }, h("table", { class: "tbl" },
        h("thead", null, h("tr", null, ["Article", "Qté", "Unité", "Détail"].map(t => h("th", null, t)))),
        h("tbody", null, cats.map(c => [h("tr", { class: "group" }, h("td", { colspan: 4 }, c)),
          H.bom.filter(r => r.cat === c).map(r => h("tr", null,
            h("td", null, r.cat === "Fil" ? h("span", { class: "cc" }, swatch(r.item.split(" ").pop()), r.item) : r.item),
            h("td", { class: "num" }, String(r.qty).replace(".", ",")), h("td", { class: "fn" }, r.unit), h("td", { class: "fn" }, r.detail)))])))));
  };

  // ------------------------------------------------------------------- routes
  function route(tok, initial) {
    try { tok = decodeURIComponent(tok || ""); } catch (e) { tok = tok || ""; }
    const T = tok.toUpperCase();
    // Fil sans zéro : #IGN-3 = IGN-03
    const wireId = id => own(WB, id) ? id : own(WB, id.replace(/-(\d)$/, "-0$1")) ? id.replace(/-(\d)$/, "-0$1") : null;
    const m = /^(planche|fil|fiche|comp)-(.+)$/i.exec(tok);
    const kind = m && m[1].toLowerCase(), K = m && m[2].toUpperCase();
    const pinOf = id => H.ecu.pins.some(p => p.id === id);
    if (kind === "planche" && own(H.sheets, K)) {
      if (rendered.planches) goSheet(K, {}); else { PL.sheet = K; navigate("planches", { keepHash: true }); }
      setHash("planche-" + K);
    } else if (kind === "fil" && wireId(K)) { const id = wireId(K); goSheet(WB[id].sheet, { wire: id }); }
    else if ((kind === "fiche" || kind === "comp") && own(OW, K) && isFiche(K)) openFiche(K);
    else if (own(TAB, tok)) navigate(tok);
    else if (own(TAB, tok.toLowerCase())) navigate(tok.toLowerCase());
    // Liens courts tapés à la main : #IGN-03, #IGN-3, #COIL3, #SNS, #CMC1.A2, #F3, #K1
    else if (T && wireId(T)) { const id = wireId(T); goSheet(WB[id].sheet, { wire: id }); }
    else if (own(H.sheets, T)) { route("planche-" + T); return; }
    else if (own(OW, T) && isFiche(T)) openFiche(T);
    else if (pinOf(T)) { navigate("ecu"); openPin(T); }
    else if (own(OW, T) && bestSheet(T)) goSheet(bestSheet(T), { owner: T });
    else if (initial) { const st = store("tab"); navigate(own(TAB, st) ? st : "synthese"); }
    else return;
    // Une adresse tapée est un point de départ : pas de « retour » vers l'endroit d'où l'on vient
    hideBack();
  }
  window.addEventListener("hashchange", () => { try { route(location.hash.replace("#", ""), false); } catch (e) { /* */ } });
  let start = "";
  try { start = location.hash.replace("#", ""); } catch (e) { start = ""; }
  route(start, true);
})();
</script>
