  function layoutSheet(sheetId) {

          h("div", { class: "meters" }, outRows)),
        H.drops.length ? h("div", { class: "panel" }, h("h3", null, "Chutes de tension des charges fortes"),
          h("p", { class: "muted", style: "margin:-2px 0 8px;font-size:13px" }, "Aller + retour sur les fils du faisceau, cuivre à 50 °C, rapportée à 13,5 V. Au-delà de 3 % : augmenter la section."),
          h("div", { class: "tbl-wrap", style: "border:0" }, h("table", { class: "tbl" },
            h("thead", null, h("tr", null, ["Charge", "Courant", "Fils", "Résistance", "Chute", ""].map(t => h("th", null, t)))),
            h("tbody", null, H.drops.map(d => h("tr", null, h("td", null, h("span", { class: "mono" }, d.id), " ", d.label),
              h("td", { class: "num" }, dec(d.a, 1) + " A"), h("td", { class: "mono fn" }, d.wires.join(" ")),
              h("td", { class: "num" }, dec(d.r_mohm, 1) + " mΩ"), h("td", { class: "num" }, dec(d.drop_v) + " V · " + dec(d.pct, 1) + " %"),
              h("td", null, d.status === "ok" ? h("span", { class: "chip good" }, "✓ OK") : h("span", { class: "chip warn" }, "! section")))))))) : null,
        h("div", { class: "cols-2" },
          h("div", { class: "panel" }, h("h3", null, "Alimentation capteurs +5 V"),
            h("p", { style: "margin:0" }, "Consommation estimée sur CMC1 G1 : ", h("strong", { class: "mono" }, H.five_v_ma + " mA"), " (pressions huile/essence, papillon, pédale). Une seule alimentation 5 V sur la RACE Gen1 : pédale et papillon la partagent.")),
          h("div", { class: "panel" }, h("h3", null, "Relais"),
            h("div", { class: "tbl-wrap", style: "border:0" }, h("table", { class: "tbl" },
              h("thead", null, h("tr", null, ["Relais", "Fonction", "Calibre", "Bobine"].map(t => h("th", null, t)))),
              h("tbody", null, relays.map(r => h("tr", null, h("td", { class: "mono" }, r), h("td", null, OW[r].label), h("td", { class: "num" }, OW[r].rating_a + " A"),
                h("td", { class: "fn" }, (wiresAt[r + ".86"] || []).map(w => otherEnd(w, r + ".86")).join(", ") + " / " + (wiresAt[r + ".85"] || []).map(w => otherEnd(w, r + ".85")).join(", "))))))))))
    );
  };

  // --------------------------------------------------------------- formboard
  RENDER.formboard = function (sec) {
    const T = H.topology;
    const kids = {}, segOf = {};
    const adj = {};
    T.segments.forEach(s => { (adj[s.a] = adj[s.a] || []).push([s.b, s]); (adj[s.b] = adj[s.b] || []).push([s.a, s]); });
    const dist = {}, parent = {};
    dist[T.root] = 0;
    const order = [T.root];
    for (let i = 0; i < order.length; i++) {
      const n = order[i];
      (adj[n] || []).forEach(([m, s]) => { if (dist[m] == null) { dist[m] = dist[n] + s.length; parent[m] = n; segOf[m] = s; (kids[n] = kids[n] || []).push(m); order.push(m); } });
    }
    const at = {}; Object.keys(OW).forEach(o => { if (OW[o].node) (at[OW[o].node] = at[OW[o].node] || []).push(o); });
    const SCALE = 300, X0 = 40, RH = 34;
    let leafRow = 0; const Y = {};
    (function place(n) {
      const k = kids[n] || [];
      if (!k.length) { Y[n] = 40 + leafRow++ * RH; return; }
      k.forEach(place);
      Y[n] = (Y[k[0]] + Y[k[k.length - 1]]) / 2;
    })(T.root);
    const X = n => X0 + dist[n] * SCALE;
    const maxX = Math.max(...Object.keys(dist).map(X));
    const W = maxX + 330, Hh = 40 + leafRow * RH + 90;
    const svg = sv("svg", { class: "formboard", viewBox: "0 0 " + W + " " + Hh, width: W, height: Hh, role: "img", "aria-label": "Formboard du faisceau à l'échelle" });
    const gL = sv("g"), gN = sv("g"), gT = sv("g");
    // règle d'échelle
    const meters = Math.ceil((maxX - X0) / SCALE);
    for (let m = 0; m <= meters; m++) {
      const x = X0 + m * SCALE;
      gL.append(sv("line", { x1: x, y1: 14, x2: x, y2: Hh - 6, stroke: "var(--rule)", "stroke-width": 1 }));
      gT.append(sv("text", { x: x + 3, y: 12, style: "font:500 10px var(--font-mono);fill:var(--muted)" }, m + " m"));
    }
    order.slice(1).forEach(n => {
      const p = parent[n], s = segOf[n];
      const w = s.bundle_mm ? 1.5 + s.bundle_mm * 0.32 : 1;
      const d = "M" + X(p) + "," + Y[p] + " V" + Y[n] + " H" + X(n);
      const g = sv("g");
      g.append(sv("path", { d: d, fill: "none", stroke: "var(--sheet)", "stroke-width": w + 4 }));
      g.append(sv("path", { d: d, fill: "none", stroke: "var(--ink)", "stroke-width": w, "stroke-linejoin": "round" }));
      g.append(sv("title", null, s.a + " → " + s.b + " · " + dec(s.length) + " m · " + s.wires + " fils · Ø " + dec(s.bundle_mm, 1) + " mm" + (s.sleeve ? " · " + s.sleeve : "")));
      gL.append(g);
      const span = X(n) - X(p);
      if (span >= 34) gT.append(sv("text", { x: (X(p) + X(n)) / 2, y: Y[n] - w / 2 - 4, "text-anchor": "middle", style: "font:500 10px var(--font-mono);fill:var(--ink-2)" },
        Math.round(s.length * 1000) + (span >= 90 && s.bundle_mm ? " · Ø" + dec(s.bundle_mm, 0) : "")));
    });
    order.forEach(n => {
      const leaf = !(kids[n] || []).length;
      gN.append(sv("circle", { cx: X(n), cy: Y[n], r: leaf ? 4 : 3, fill: "var(--ink)" }));
      const owners = (at[n] || []).filter(o => !OW[o].cable);
      if (leaf) {
        const t = sv("text", { x: X(n) + 9, y: Y[n] + 4, style: "font-size:12px" });
        t.append(sv("tspan", { style: "font-weight:600" }, T.nodes[n]));
        if (owners.length) t.append(sv("tspan", { style: "font:500 10.5px var(--font-mono);fill:var(--ink-2)" }, "  " + owners.join(" ")));
        gT.append(t);
      } else if (owners.length || n === T.root) {
        const lx = X(n) + 3, ly = Y[n] + 11;
        gT.append(sv("text", { x: lx, y: ly, transform: "rotate(38 " + lx + " " + ly + ")", style: "font:500 9.5px var(--font-mono);fill:var(--accent);paint-order:stroke;stroke:var(--sheet);stroke-width:3px" }, trunc(owners.join(" "), 30)));
      }
    });
    svg.append(gL, gN, gT);
    const segRows = order.slice(1).map(n => segOf[n]).map(s => h("tr", null, h("td", { class: "mono" }, s.a + " → " + s.b),
      h("td", null, T.nodes[s.b]), h("td", { class: "num" }, Math.round(s.length * 1000) + " mm"), h("td", { class: "num" }, s.wires),
      h("td", { class: "num" }, s.bundle_mm ? dec(s.bundle_mm, 1) + " mm" : "—"), h("td", { class: "mono fn" }, s.sleeve || "—")));
    sec.append(h("h2", null, "Formboard"),
      h("p", { class: "lede" }, (T.estimated ? "Longueurs ESTIMÉES : mesure chaque tronçon sur la voiture (ficelle le long du trajet réel), reporte les valeurs dans la section topology du YAML et régénère : toutes les longueurs de coupe suivent. " : "") +
        "Tracé à l'échelle (1 m = " + SCALE + " px) ; l'épaisseur des traits suit le diamètre estimé du toron."),
      h("div", { class: "frame", style: "max-height:none" }, svg),
      h("h3", { style: "margin-top:24px" }, "Tronçons, torons et gaine"),
      h("div", { class: "tbl-wrap" }, h("table", { class: "tbl" },
        h("thead", null, h("tr", null, ["Tronçon", "Vers", "Longueur", "Fils", "Ø toron", "Gaine conseillée"].map(t => h("th", null, t)))),
        h("tbody", null, segRows))));
  };

  // ---------------------------------------------------------------- contrôles
  RENDER.controles = function (sec) {
    const state = store("checks") || {};
    const blocks = H.checks.map((ph, pi) => {
      const counter = h("span", { class: "count" });
      const upd = () => { const n = ph.items.filter((_, ii) => state[pi + "-" + ii]).length; counter.textContent = n + " / " + ph.items.length; };
      const list = h("ol", null, ph.items.map((it, ii) => {
        const id = "chk-" + pi + "-" + ii;
        const box = h("input", { type: "checkbox", id: id, checked: !!state[pi + "-" + ii] });
        box.addEventListener("change", () => { state[pi + "-" + ii] = box.checked; store("checks", state); upd(); });
        return h("li", null, h("label", { for: id }, box, h("span", null, it)));
      }));
      upd();
      return h("div", { class: "phase" }, h("header", null, h("h3", null, ph.phase), counter), list);
    });
    let armed = false;
    const reset = h("button", { class: "btn" }, "Tout décocher");
    reset.addEventListener("click", () => {
      if (!armed) { armed = true; reset.textContent = "Confirmer la remise à zéro"; setTimeout(() => { armed = false; reset.textContent = "Tout décocher"; }, 4000); return; }
      Object.keys(state).forEach(k => delete state[k]); store("checks", state);
      sec.replaceChildren(); RENDER.controles(sec);
    });
    sec.append(h("h2", null, "Contrôles"),
      h("p", { class: "lede" }, "Trois passes : au banc avant de sertir, faisceau terminé avant de brancher l'ECU, puis première mise sous tension. Les cases restent cochées sur cet appareil."),
      h("div", { class: "stack" }, blocks, h("div", null, reset)),
      h("h3", { style: "margin-top:28px" }, "Réglages MTune liés au câblage"),
      h("div", { class: "tbl-wrap" }, h("table", { class: "tbl" },
        h("thead", null, h("tr", null, h("th", null, "Fonction"), h("th", null, "Réglage"))),
        h("tbody", null, H.mtune.map(t => h("tr", null, h("td", null, h("strong", null, t.item)), h("td", null, t.value)))))));
  };

  // ------------------------------------------------------------- nomenclature
  RENDER.nomenclature = function (sec) {
    const cats = [...new Set(H.bom.map(r => r.cat))];
    sec.append(h("h2", null, "Nomenclature"),
      h("p", { class: "lede" }, "Quantités calculées depuis le faisceau : contacts réellement utilisés, mètres de fil par section et couleur (+10 % de marge), gaine par tronçon du formboard, deux étiquettes par fil."),
      h("div", { class: "tbl-wrap" }, h("table", { class: "tbl" },
        h("thead", null, h("tr", null, ["Article", "Qté", "Unité", "Détail"].map(t => h("th", null, t)))),
        h("tbody", null, cats.map(c => [h("tr", { class: "group" }, h("td", { colspan: 4 }, c)),
          H.bom.filter(r => r.cat === c).map(r => h("tr", null,
            h("td", null, r.cat === "Fil" ? h("span", { class: "cc" }, swatch(r.item.split(" ").pop()), r.item) : r.item),
            h("td", { class: "num" }, String(r.qty).replace(".", ",")), h("td", { class: "fn" }, r.unit), h("td", { class: "fn" }, r.detail)))])))));
  };

  // ------------------------------------------------------------------- start
  let first = "synthese";
  try { const hsh = location.hash.replace("#", ""); if (sections[hsh]) first = hsh; else if (sections[store("tab")]) first = store("tab"); } catch (e) { /* ignore */ }
  show(first);
})();
</script>
